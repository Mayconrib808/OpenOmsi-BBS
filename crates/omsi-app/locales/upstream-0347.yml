"This room uses a different map. Joining reloads the world and ends the current drive.":
  be: "У гэтым пакоі выкарыстоўваецца іншая карта. Пры далучэнні свет будзе загружаны нанова, а бягучая паездка завершыцца."
  ca: "Aquesta sala fa servir un mapa diferent. En unir-t’hi, es tornarà a carregar el món i s’acabarà la conducció actual."
  cs: "Tato místnost používá jinou mapu. Připojením se znovu načte svět a ukončí aktuální jízda."
  de: "Dieser Raum verwendet eine andere Karte. Beim Beitreten wird die Welt neu geladen und die aktuelle Fahrt beendet."
  es: "Esta sala usa un mapa diferente. Al unirte se recargará el mundo y finalizará la conducción actual."
  fr: "Ce salon utilise une autre carte. Le rejoindre rechargera le monde et mettra fin à la conduite en cours."
  hi: "यह कमरा अलग नक्शे का उपयोग करता है। शामिल होने पर दुनिया फिर से लोड होगी और वर्तमान ड्राइव समाप्त हो जाएगी।"
  hu: "Ez a szoba másik térképet használ. Csatlakozáskor a világ újratöltődik, és a jelenlegi vezetés véget ér."
  id: "Ruang ini menggunakan peta yang berbeda. Bergabung akan memuat ulang dunia dan mengakhiri perjalanan saat ini."
  it: "Questa stanza usa una mappa diversa. Entrando, il mondo verrà ricaricato e la guida attuale terminerà."
  ja: "このルームでは別のマップを使用しています。参加するとワールドが再読み込みされ、現在の運転が終了します。"
  ka: "ეს ოთახი სხვა რუკას იყენებს. შესვლისას სამყარო ხელახლა ჩაიტვირთება და მიმდინარე მგზავრობა დასრულდება."
  kk: "Бұл бөлме басқа картаны пайдаланады. Қосылғанда әлем қайта жүктеліп, ағымдағы сапар аяқталады."
  ko: "이 방은 다른 지도를 사용합니다. 참가하면 월드를 다시 불러오고 현재 운행이 종료됩니다."
  ms: "Bilik ini menggunakan peta yang berbeza. Menyertainya akan memuat semula dunia dan menamatkan pemanduan semasa."
  nl: "Deze kamer gebruikt een andere kaart. Bij het deelnemen wordt de wereld opnieuw geladen en eindigt de huidige rit."
  pl: "Ten pokój używa innej mapy. Dołączenie spowoduje ponowne wczytanie świata i zakończenie obecnej jazdy."
  pt: "Esta sala usa um mapa diferente. Entrar recarrega o mundo e encerra a condução atual."
  pt-pt: "Esta sala utiliza um mapa diferente. Ao entrar, o mundo será recarregado e a condução atual terminará."
  ru: "В этой комнате используется другая карта. При подключении мир будет загружен заново, а текущая поездка завершится."
  sr: "Ova soba koristi drugu mapu. Pridruživanje ponovo učitava svet i završava trenutnu vožnju."
  sv: "Det här rummet använder en annan karta. Om du går med laddas världen om och den aktuella körningen avslutas."
  th: "ห้องนี้ใช้แผนที่อื่น การเข้าร่วมจะโหลดโลกใหม่และสิ้นสุดการขับขี่ปัจจุบัน"
  tl: "Ibang mapa ang gamit ng kuwartong ito. Sa pagsali, muling ilo-load ang mundo at matatapos ang kasalukuyang pagmamaneho."
  tr: "Bu oda farklı bir harita kullanıyor. Katılmak oyun dünyasını yeniden yükler ve mevcut sürüşü sonlandırır."
  uk: "У цій кімнаті використовується інша карта. Приєднання перезавантажить світ і завершить поточну поїздку."
  vi: "Phòng này dùng bản đồ khác. Tham gia sẽ tải lại thế giới và kết thúc lượt lái hiện tại."
  zh: "此房间使用不同的地图。加入后会重新加载世界并结束当前行程。"
  zh-tw: "此房間使用不同地圖。加入後會重新載入世界並結束目前的行程。"

"Joining leaves the current room. Your vehicle and position are kept on this map.":
  be: "Пры далучэнні вы пакінеце бягучы пакой. Ваш транспарт і пазіцыя на гэтай карце захаваюцца."
  ca: "En unir-t’hi, sortiràs de la sala actual. El vehicle i la posició es conservaran en aquest mapa."
  cs: "Připojením opustíte aktuální místnost. Vaše vozidlo a poloha na této mapě zůstanou zachovány."
  de: "Beim Beitreten verlässt du den aktuellen Raum. Fahrzeug und Position bleiben auf dieser Karte erhalten."
  es: "Al unirte saldrás de la sala actual. Tu vehículo y tu posición se conservarán en este mapa."
  fr: "En rejoignant ce salon, vous quitterez le salon actuel. Votre véhicule et votre position seront conservés sur cette carte."
  hi: "शामिल होने पर आप वर्तमान कमरा छोड़ देंगे। इस नक्शे पर आपका वाहन और स्थान बना रहेगा।"
  hu: "Csatlakozáskor elhagyod a jelenlegi szobát. A járműved és a helyzeted ezen a térképen megmarad."
  id: "Bergabung akan membuat Anda keluar dari ruang saat ini. Kendaraan dan posisi Anda di peta ini akan dipertahankan."
  it: "Entrando lascerai la stanza attuale. Il veicolo e la posizione verranno mantenuti su questa mappa."
  ja: "参加すると現在のルームから退出します。このマップ上の車両と位置は維持されます。"
  ka: "შესვლისას დატოვებთ მიმდინარე ოთახს. თქვენი სატრანსპორტო საშუალება და მდებარეობა ამ რუკაზე შენარჩუნდება."
  kk: "Қосылғанда ағымдағы бөлмеден шығасыз. Бұл картада көлігіңіз бен орныңыз сақталады."
  ko: "참가하면 현재 방을 나갑니다. 이 지도에서 차량과 위치는 유지됩니다."
  ms: "Menyertainya akan meninggalkan bilik semasa. Kenderaan dan kedudukan anda pada peta ini akan dikekalkan."
  nl: "Bij het deelnemen verlaat je de huidige kamer. Je voertuig en positie op deze kaart blijven behouden."
  pl: "Dołączenie spowoduje opuszczenie obecnego pokoju. Twój pojazd i pozycja na tej mapie zostaną zachowane."
  pt: "Ao entrar, você sairá da sala atual. Seu veículo e sua posição serão mantidos neste mapa."
  pt-pt: "Ao entrar, sairás da sala atual. O teu veículo e a tua posição serão mantidos neste mapa."
  ru: "При подключении вы покинете текущую комнату. Ваш транспорт и позиция на этой карте сохранятся."
  sr: "Pridruživanjem napuštate trenutnu sobu. Vaše vozilo i položaj na ovoj mapi biće sačuvani."
  sv: "Om du går med lämnar du det aktuella rummet. Ditt fordon och din position på den här kartan behålls."
  th: "การเข้าร่วมจะออกจากห้องปัจจุบัน โดยคงรถและตำแหน่งของคุณไว้บนแผนที่นี้"
  tl: "Sa pagsali, aalis ka sa kasalukuyang kuwarto. Mananatili ang iyong sasakyan at posisyon sa mapang ito."
  tr: "Katıldığınızda mevcut odadan ayrılırsınız. Bu haritadaki aracınız ve konumunuz korunur."
  uk: "Після приєднання ви залишите поточну кімнату. Ваш транспорт і позиція на цій карті збережуться."
  vi: "Tham gia sẽ rời phòng hiện tại. Xe và vị trí của bạn trên bản đồ này sẽ được giữ nguyên."
  zh: "加入后将离开当前房间；在相同地图上会保留您的车辆和位置。"
  zh-tw: "加入後將離開目前房間；在相同地圖上會保留您的車輛與位置。"

