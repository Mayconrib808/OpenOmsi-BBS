"This room does not allow your current vehicle. Joining may disconnect you.":
  be: "У гэтым пакоі ваш транспартны сродак не дазволены. Далучэнне можа прывесці да адключэння."
  ca: "Aquesta sala no permet el teu vehicle actual. Si hi entres, et podrien desconnectar."
  cs: "Tato místnost nepovoluje vaše současné vozidlo. Po připojení můžete být odpojeni."
  de: "Dein aktuelles Fahrzeug ist in diesem Raum nicht erlaubt. Beim Beitritt könntest du getrennt werden."
  es: "Esta sala no permite tu vehículo actual. Si te unes, podrían desconectarte."
  fr: "Votre véhicule actuel n'est pas autorisé dans ce salon. Le rejoindre peut entraîner votre déconnexion."
  hi: "इस कमरे में आपके वर्तमान वाहन की अनुमति नहीं है। शामिल होने पर आपका कनेक्शन काटा जा सकता है।"
  hu: "Ebben a szobában a jelenlegi járműved nem engedélyezett. Csatlakozáskor megszakíthatják a kapcsolatodat."
  id: "Ruang ini tidak mengizinkan kendaraan Anda saat ini. Bergabung dapat membuat Anda terputus."
  it: "Il tuo veicolo attuale non è consentito in questa stanza. Entrando potresti essere disconnesso."
  ja: "このルームでは現在の車両が許可されていません。参加すると切断される場合があります。"
  ka: "ამ ოთახში თქვენი ამჟამინდელი სატრანსპორტო საშუალება დაშვებული არ არის. შეერთებისას კავშირი შეიძლება გაწყდეს."
  kk: "Бұл бөлмеде қазіргі көлігіңізге рұқсат етілмейді. Қосылған кезде байланысыңыз үзілуі мүмкін."
  ko: "이 방에서는 현재 차량을 허용하지 않습니다. 참가하면 연결이 끊어질 수 있습니다."
  ms: "Bilik ini tidak membenarkan kenderaan semasa anda. Menyertainya mungkin memutuskan sambungan anda."
  nl: "Je huidige voertuig is niet toegestaan in deze kamer. Als je deelneemt, kan je verbinding worden verbroken."
  pl: "Twój obecny pojazd nie jest dozwolony w tym pokoju. Dołączenie może spowodować rozłączenie."
  pt: "Seu veículo atual não é permitido nesta sala. Entrar pode desconectar você."
  pt-pt: "O teu veículo atual não é permitido nesta sala. Ao entrares, podes ser desligado."
  ru: "Ваш текущий транспорт не разрешён в этой комнате. При присоединении вас могут отключить."
  sr: "Vaše trenutno vozilo nije dozvoljeno u ovoj sobi. Pridruživanje može prekinuti vašu vezu."
  sv: "Ditt nuvarande fordon är inte tillåtet i det här rummet. Om du går med kan du kopplas från."
  th: "ห้องนี้ไม่อนุญาตให้ใช้ยานพาหนะปัจจุบันของคุณ การเข้าร่วมอาจทำให้คุณถูกตัดการเชื่อมต่อ"
  tl: "Hindi pinapayagan sa kuwartong ito ang kasalukuyan mong sasakyan. Maaaring maputol ang koneksiyon mo kapag sumali ka."
  tr: "Bu oda mevcut aracınıza izin vermiyor. Katıldığınızda bağlantınız kesilebilir."
  uk: "У цій кімнаті ваш поточний транспорт не дозволений. Приєднання може призвести до відключення."
  vi: "Phòng này không cho phép phương tiện hiện tại của bạn. Tham gia có thể khiến bạn bị ngắt kết nối."
  zh: "此房间不允许您当前使用的车辆。加入后您可能会被断开连接。"
  zh-tw: "此房間不允許您目前使用的車輛，加入後可能會被中斷連線。"

"Optional visual acknowledgement when an approaching compatible bus is at passenger capacity":
  ca: "Mirada breu a un autobús compatible que arriba ple; abaixen el braç sense canviar l'embarcament"
