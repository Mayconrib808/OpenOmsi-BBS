  th: "มองรถบัสสายที่ตรงกันซึ่งกำลังเข้ามาและเต็มอยู่ชั่วครู่ พร้อมลดแขน โดยไม่เปลี่ยนการขึ้นรถ"
  vi: "Nhìn thoáng qua xe buýt đúng tuyến đang đến nhưng đã đầy, hạ tay mà không thay đổi việc lên xe"
