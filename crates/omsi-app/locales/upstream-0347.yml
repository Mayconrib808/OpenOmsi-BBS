_version: 2

"Sessions and servers are run by players, not by openOMSI. The host receives your driver name, network address, chat and voice, and may keep logs.":
  de: "Sitzungen und Server werden von Spielern betrieben, nicht von openOMSI. Der Host erhält deinen Fahrernamen, deine Netzwerkadresse, deinen Chat und deine Stimme und kann Protokolle aufbewahren."
  fr: "Les sessions et les serveurs sont gérés par des joueurs, pas par openOMSI. L'hôte reçoit votre nom de conducteur, votre adresse réseau, votre chat et votre voix, et peut conserver des journaux."
  ru: "Сессии и серверы ведут игроки, а не openOMSI. Хост получает ваше имя водителя, сетевой адрес, сообщения чата и голос и может хранить журналы."
  sr: "Sesije i servere vode igrači, a ne openOMSI. Domaćin dobija vaše ime vozača, mrežnu adresu, čet i glas i može da čuva zapise."
  uk: "Сесії та сервери ведуть гравці, а не openOMSI. Хост отримує ваше ім'я водія, мережеву адресу, повідомлення чату й голос і може зберігати журнали."
  be: "Сесіі і серверы вядуць гульцы, а не openOMSI. Хост атрымлівае ваша імя вадзіцеля, сеткавы адрас, паведамленні чата і голас і можа захоўваць журналы."
  kk: "Сессиялар мен серверлерді openOMSI емес, ойыншылар басқарады. Хост сіздің жүргізуші атыңызды, желі мекенжайыңызды, чатыңыз бен дауысыңызды алады және журналдарды сақтауы мүмкін."
  pl: "Sesje i serwery prowadzą gracze, a nie openOMSI. Host otrzymuje Twoją nazwę kierowcy, adres sieciowy, czat i głos i może przechowywać logi."
  cs: "Relace a servery provozují hráči, ne openOMSI. Hostitel dostává vaše jméno řidiče, síťovou adresu, chat a hlas a může uchovávat záznamy."
  hu: "A munkameneteket és a szervereket játékosok üzemeltetik, nem az openOMSI. A gazda megkapja a sofőrnevedet, a hálózati címedet, a csevegésedet és a hangodat, és naplókat is őrizhet."
  es: "Las sesiones y los servidores los gestionan jugadores, no openOMSI. El anfitrión recibe tu nombre de conductor, tu dirección de red, tu chat y tu voz, y puede guardar registros."
  ca: "Les sessions i els servidors els gestionen jugadors, no openOMSI. L'amfitrió rep el teu nom de conductor, la teva adreça de xarxa, el teu xat i la teva veu, i pot conservar registres."
  pt: "Sessões e servidores são administrados por jogadores, não pelo openOMSI. O anfitrião recebe seu nome de motorista, endereço de rede, chat e voz, e pode guardar registros."
  pt-pt: "As sessões e os servidores são geridos por jogadores, não pelo openOMSI. O anfitrião recebe o seu nome de motorista, endereço de rede, chat e voz, e pode guardar registos."
  it: "Sessioni e server sono gestiti dai giocatori, non da openOMSI. L'host riceve il tuo nome da autista, il tuo indirizzo di rete, la tua chat e la tua voce, e può conservare dei log."
  nl: "Sessies en servers worden door spelers beheerd, niet door openOMSI. De host ontvangt je chauffeursnaam, netwerkadres, chat en stem, en kan logboeken bewaren."
  sv: "Sessioner och servrar drivs av spelare, inte av openOMSI. Värden får ditt förarnamn, din nätverksadress, din chatt och din röst och kan spara loggar."
  tr: "Oturumları ve sunucuları openOMSI değil, oyuncular yönetir. Sunucu sahibi sürücü adınızı, ağ adresinizi, sohbetinizi ve sesinizi alır ve kayıt tutabilir."
  ja: "セッションとサーバーは openOMSI ではなくプレイヤーが運営しています。ホストはあなたのドライバー名、ネットワークアドレス、チャット、音声を受け取り、ログを保存することがあります。"
  zh-tw: "工作階段和伺服器由玩家經營，而非 openOMSI。主持人會收到你的駕駛名稱、網路位址、聊天和語音，並可能保留紀錄。"
  ko: "세션과 서버는 openOMSI가 아니라 플레이어가 운영합니다. 호스트는 운전자 이름, 네트워크 주소, 채팅과 음성을 받으며 로그를 보관할 수 있습니다."
  th: "เซสชันและเซิร์ฟเวอร์ดำเนินการโดยผู้เล่น ไม่ใช่ openOMSI โฮสต์จะได้รับชื่อคนขับ ที่อยู่เครือข่าย แชต และเสียงของคุณ และอาจเก็บบันทึกไว้"
  vi: "Phiên và máy chủ do người chơi vận hành, không phải openOMSI. Chủ phòng nhận được tên tài xế, địa chỉ mạng, tin nhắn trò chuyện và giọng nói của bạn, và có thể lưu nhật ký."
  id: "Sesi dan server dijalankan oleh pemain, bukan oleh openOMSI. Host menerima nama sopir, alamat jaringan, obrolan, dan suara Anda, serta dapat menyimpan log."
  ms: "Sesi dan pelayan dikendalikan oleh pemain, bukan oleh openOMSI. Hos menerima nama pemandu, alamat rangkaian, sembang dan suara anda, dan mungkin menyimpan log."
  tl: "Ang mga session at server ay pinapatakbo ng mga manlalaro, hindi ng openOMSI. Natatanggap ng host ang pangalan mo bilang driver, ang network address mo, ang chat at boses mo, at maaari itong magtago ng mga log."
  zh: "会话和服务器由玩家运营，而非 openOMSI。主机会收到你的司机名称、网络地址、聊天和语音，并可能保留日志。"
  hi: "सेशन और सर्वर खिलाड़ी चलाते हैं, openOMSI नहीं। होस्ट को आपका ड्राइवर नाम, नेटवर्क पता, चैट और आवाज़ मिलती है, और वह लॉग रख सकता है।"
  ka: "სესიებსა და სერვერებს მოთამაშეები მართავენ და არა openOMSI. ჰოსტი იღებს თქვენს მძღოლის სახელს, ქსელის მისამართს, ჩატსა და ხმას და შეიძლება ჩანაწერები შეინახოს."

"As the host, your game receives your players' driver names, network addresses, chat and voice. You are responsible for what you keep of it, such as logs and bans.":
  de: "Als Host erhält dein Spiel die Fahrernamen, Netzwerkadressen, Chats und Stimmen deiner Spieler. Du bist dafür verantwortlich, was du davon aufbewahrst, etwa Protokolle und Sperren."
  fr: "En tant qu'hôte, votre jeu reçoit les noms de conducteur, les adresses réseau, le chat et la voix de vos joueurs. Vous êtes responsable de ce que vous en conservez, comme les journaux et les bannissements."
  ru: "Как хост, ваша игра получает имена водителей, сетевые адреса, сообщения чата и голоса ваших игроков. Вы отвечаете за то, что из этого храните, например журналы и баны."
  sr: "Kao domaćin, vaša igra dobija imena vozača, mrežne adrese, čet i glas vaših igrača. Vi ste odgovorni za ono što od toga čuvate, kao što su zapisi i zabrane."
  uk: "Як хост, ваша гра отримує імена водіїв, мережеві адреси, повідомлення чату й голоси ваших гравців. Ви відповідаєте за те, що з цього зберігаєте, наприклад журнали й бани."
  be: "Як хост, ваша гульня атрымлівае імёны вадзіцеляў, сеткавыя адрасы, паведамленні чата і галасы вашых гульцоў. Вы адказваеце за тое, што з гэтага захоўваеце, напрыклад журналы і баны."
  kk: "Хост ретінде ойыныңыз ойыншыларыңыздың жүргізуші аттарын, желі мекенжайларын, чаты мен дауыстарын алады. Олардың ішінен не сақтайтыныңызға, мысалы журналдар мен тыйымдарға, өзіңіз жауаптысыз."
  pl: "Jako host Twoja gra otrzymuje nazwy kierowców, adresy sieciowe, czat i głos Twoich graczy. Odpowiadasz za to, co z tego przechowujesz, na przykład logi i bany."
  cs: "Jako hostitel vaše hra dostává jména řidičů, síťové adresy, chat a hlas vašich hráčů. Odpovídáte za to, co si z toho ponecháte, například záznamy a zákazy."
  hu: "Gazdaként a játékod megkapja a játékosaid sofőrnevét, hálózati címét, csevegését és hangját. Te felelsz azért, amit ebből megőrzöl, például a naplókért és a kitiltásokért."
  es: "Como anfitrión, tu juego recibe los nombres de conductor, las direcciones de red, el chat y la voz de tus jugadores. Eres responsable de lo que conserves, como los registros y las expulsiones."
  ca: "Com a amfitrió, el teu joc rep els noms de conductor, les adreces de xarxa, el xat i la veu dels teus jugadors. Ets responsable del que en conservis, com ara els registres i les expulsions."
  pt: "Como anfitrião, seu jogo recebe os nomes de motorista, endereços de rede, chat e voz dos seus jogadores. Você é responsável pelo que guarda disso, como registros e banimentos."
  pt-pt: "Como anfitrião, o seu jogo recebe os nomes de motorista, endereços de rede, chat e voz dos seus jogadores. É responsável pelo que guarda disso, como registos e banimentos."
  it: "Come host, il tuo gioco riceve i nomi da autista, gli indirizzi di rete, la chat e la voce dei tuoi giocatori. Sei responsabile di ciò che ne conservi, come log e ban."
  nl: "Als host ontvangt je spel de chauffeursnamen, netwerkadressen, chat en stemmen van je spelers. Jij bent verantwoordelijk voor wat je daarvan bewaart, zoals logboeken en bans."
  sv: "Som värd tar ditt spel emot dina spelares förarnamn, nätverksadresser, chatt och röster. Du ansvarar för vad du sparar av det, till exempel loggar och avstängningar."
  tr: "Sunucu sahibi olarak oyununuz oyuncularınızın sürücü adlarını, ağ adreslerini, sohbetlerini ve seslerini alır. Bunlardan sakladıklarınızdan, örneğin kayıtlardan ve yasaklardan siz sorumlusunuz."
  ja: "ホストとして、あなたのゲームはプレイヤーのドライバー名、ネットワークアドレス、チャット、音声を受け取ります。ログや BAN など、そのうち保存するものの責任はあなたにあります。"
  zh-tw: "身為主持人，你的遊戲會收到玩家的駕駛名稱、網路位址、聊天和語音。你要為自己保留的內容負責，例如紀錄和封鎖名單。"
  ko: "호스트로서 당신의 게임은 플레이어의 운전자 이름, 네트워크 주소, 채팅과 음성을 받습니다. 로그와 차단 목록처럼 그중 보관하는 것에 대한 책임은 당신에게 있습니다."
  th: "ในฐานะโฮสต์ เกมของคุณจะได้รับชื่อคนขับ ที่อยู่เครือข่าย แชต และเสียงของผู้เล่น คุณต้องรับผิดชอบสิ่งที่คุณเก็บไว้ เช่น บันทึกและการแบน"
  vi: "Là chủ phòng, trò chơi của bạn nhận tên tài xế, địa chỉ mạng, tin nhắn trò chuyện và giọng nói của người chơi. Bạn chịu trách nhiệm về những gì mình lưu lại, như nhật ký và lệnh cấm."
  id: "Sebagai host, game Anda menerima nama sopir, alamat jaringan, obrolan, dan suara pemain Anda. Anda bertanggung jawab atas apa yang Anda simpan, seperti log dan larangan."
  ms: "Sebagai hos, permainan anda menerima nama pemandu, alamat rangkaian, sembang dan suara pemain anda. Anda bertanggungjawab atas apa yang anda simpan, seperti log dan sekatan."
  tl: "Bilang host, natatanggap ng laro mo ang mga pangalan ng driver, network address, chat at boses ng mga manlalaro mo. Ikaw ang may pananagutan sa itinatago mo mula rito, gaya ng mga log at ban."
  zh: "作为主机，你的游戏会收到玩家的司机名称、网络地址、聊天和语音。你要为自己保留的内容负责，例如日志和封禁名单。"
  hi: "होस्ट के रूप में, आपके गेम को आपके खिलाड़ियों के ड्राइवर नाम, नेटवर्क पते, चैट और आवाज़ मिलती है। आप जो रखते हैं, जैसे लॉग और बैन, उसकी ज़िम्मेदारी आपकी है।"
  ka: "როგორც ჰოსტი, თქვენი თამაში იღებს თქვენი მოთამაშეების მძღოლის სახელებს, ქსელის მისამართებს, ჩატსა და ხმას. თქვენ პასუხისმგებელი ხართ იმაზე, რასაც ინახავთ, მაგალითად ჩანაწერებსა და აკრძალვებზე."

