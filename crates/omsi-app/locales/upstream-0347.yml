"Made from this computer's ID, different for each server owner, so servers cannot match you with each other. Some servers turn away players without it.":
  de: "Aus der Kennung dieses Computers erzeugt, für jeden Serverbetreiber anders, sodass Server dich nicht untereinander abgleichen können. Manche Server lassen Spieler ohne sie nicht herein."
  fr: "Calculé à partir de l'identifiant de cet ordinateur, différent pour chaque propriétaire de serveur : les serveurs ne peuvent pas vous reconnaître entre eux. Certains serveurs refusent les joueurs qui ne l'envoient pas."
  ru: "Создаётся из идентификатора этого компьютера и отличается для каждого владельца сервера, поэтому серверы не могут сопоставить вас между собой. Некоторые серверы не пускают игроков без него."
  sr: "Pravi se iz ID-ja ovog računara, različit je za svakog vlasnika servera, pa vas serveri ne mogu povezati međusobno. Neki serveri ne puštaju igrače bez njega."
  uk: "Створюється з ідентифікатора цього комп'ютера й відрізняється для кожного власника сервера, тож сервери не можуть зіставити вас між собою. Деякі сервери не пускають гравців без нього."
  be: "Ствараецца з ідэнтыфікатара гэтага камп'ютара і адрозніваецца для кожнага ўладальніка сервера, таму серверы не могуць супаставіць вас паміж сабой. Некаторыя серверы не пускаюць гульцоў без яго."
  kk: "Осы компьютердің идентификаторынан жасалады және әр сервер иесі үшін әртүрлі, сондықтан серверлер сізді бір-бірімен салыстыра алмайды. Кейбір серверлер онсыз ойыншыларды кіргізбейді."
  pl: "Tworzony z identyfikatora tego komputera, inny dla każdego właściciela serwera, więc serwery nie mogą się wymieniać informacją o Tobie. Niektóre serwery nie wpuszczają graczy bez niego."
  cs: "Vytváří se z ID tohoto počítače a pro každého majitele serveru je jiný, takže vás servery nemohou mezi sebou spárovat. Některé servery bez něj hráče nepustí."
  hu: "Ennek a számítógépnek az azonosítójából készül, minden szervertulajdonosnál más, így a szerverek nem tudnak összepárosítani egymás között. Néhány szerver nem enged be nélküle."
  es: "Se genera a partir del ID de este ordenador y es distinto para cada propietario de servidor, así que los servidores no pueden identificarte entre ellos. Algunos servidores no dejan entrar a jugadores sin él."
  ca: "Es genera a partir de l'ID d'aquest ordinador i és diferent per a cada propietari de servidor, així que els servidors no et poden identificar entre ells. Alguns servidors no deixen entrar jugadors sense ell."
  pt: "Gerado a partir do ID deste computador, diferente para cada dono de servidor, então os servidores não conseguem relacionar você entre si. Alguns servidores recusam jogadores sem ele."
  pt-pt: "Gerado a partir do ID deste computador, diferente para cada dono de servidor, pelo que os servidores não o conseguem relacionar entre si. Alguns servidores recusam jogadores sem ele."
  it: "Ricavato dall'ID di questo computer, diverso per ogni proprietario di server, così i server non possono collegarti tra loro. Alcuni server non fanno entrare i giocatori senza."
  nl: "Gemaakt van de ID van deze computer, anders voor elke servereigenaar, zodat servers je niet onderling kunnen koppelen. Sommige servers laten spelers zonder dit kenmerk niet toe."
  sv: "Skapas från datorns ID och är olika för varje serverägare, så servrar kan inte koppla ihop dig med varandra. Vissa servrar släpper inte in spelare utan den."
  tr: "Bu bilgisayarın kimliğinden üretilir ve her sunucu sahibi için farklıdır, bu yüzden sunucular sizi birbirleriyle eşleştiremez. Bazı sunucular bu olmadan oyuncu kabul etmez."
  ja: "このコンピューターの ID から作られ、サーバーの持ち主ごとに異なるため、サーバー同士であなたを照合できません。これがないプレイヤーを拒否するサーバーもあります。"
  zh-tw: "由這台電腦的 ID 產生，每個伺服器擁有者各不相同，因此伺服器之間無法比對出你。有些伺服器會拒絕沒有它的玩家。"
  ko: "이 컴퓨터의 ID로 만들어지며 서버 소유자마다 달라서, 서버끼리 당신을 대조할 수 없습니다. 일부 서버는 이것이 없는 플레이어를 받지 않습니다."
  th: "สร้างจาก ID ของคอมพิวเตอร์เครื่องนี้ และแตกต่างกันในแต่ละเจ้าของเซิร์ฟเวอร์ เซิร์ฟเวอร์จึงจับคู่คุณระหว่างกันไม่ได้ บางเซิร์ฟเวอร์ไม่รับผู้เล่นที่ไม่มีตัวระบุนี้"
  vi: "Được tạo từ ID của máy tính này, khác nhau với mỗi chủ máy chủ, nên các máy chủ không thể đối chiếu bạn với nhau. Một số máy chủ từ chối người chơi không có nó."
  id: "Dibuat dari ID komputer ini, berbeda untuk setiap pemilik server, sehingga server tidak bisa mencocokkan Anda satu sama lain. Beberapa server menolak pemain tanpanya."
  ms: "Dijana daripada ID komputer ini, berbeza bagi setiap pemilik pelayan, jadi pelayan tidak dapat memadankan anda antara satu sama lain. Sesetengah pelayan menolak pemain tanpanya."
  tl: "Ginawa mula sa ID ng computer na ito, iba para sa bawat may-ari ng server, kaya hindi ka maitutugma ng mga server sa isa't isa. May mga server na hindi tumatanggap ng manlalarong wala nito."
  zh: "由这台电脑的 ID 生成，每个服务器所有者各不相同，因此服务器之间无法比对出你。有些服务器会拒绝没有它的玩家。"
  hi: "इस कंप्यूटर की ID से बनता है और हर सर्वर मालिक के लिए अलग होता है, इसलिए सर्वर आपस में आपको मिला नहीं सकते। कुछ सर्वर इसके बिना खिलाड़ियों को नहीं आने देते।"
  ka: "იქმნება ამ კომპიუტერის ID-დან და განსხვავებულია ყოველი სერვერის მფლობელისთვის, ამიტომ სერვერები ერთმანეთთან ვერ დაგაკავშირებენ. ზოგი სერვერი მის გარეშე მოთამაშეებს არ უშვებს."

