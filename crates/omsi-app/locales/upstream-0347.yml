  kk: "Жақындаған толы автобусты аз уақыт қарап, қолын түсіреді; міну тәртібі өзгермейді"
  pl: "Krótkie spojrzenie na pełny autobus właściwej linii; opuszczenie ręki bez zmiany wsiadania"
  cs: "Krátký pohled na plný autobus správné linky; ruka klesne bez změny nástupu"
  hu: "Rövid pillantás a közeledő megtelt buszra; leengedett kar, változatlan felszállás"
  es: "Mirada breve a un autobús compatible lleno que se acerca; bajan el brazo sin cambiar el embarque"
  pt: "Olhar breve para um ônibus compatível lotado que se aproxima; baixam o braço sem alterar o embarque"
  pt-pt: "Olhar breve para um autocarro compatível lotado que se aproxima; baixam o braço sem alterar o embarque"
