  tl: "Panandaliang tingin sa papalapit na tamang bus na puno na; ibinababa ang braso nang hindi binabago ang pagsakay"
  sv: "En kort blick mot en full buss på rätt linje; armen sänks utan att påverka ombordstigning"
  sr: "Kratak pogled na odgovarajući pun autobus koji prilazi; ruka se spušta bez promene ukrcavanja"
  ka: "მოკლე მზერა მოახლოებულ შესაბამის გადავსებულ ავტობუსზე; ხელი ეშვება, ჩასხდომა არ იცვლება"

