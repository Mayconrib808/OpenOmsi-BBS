[package]
name = "omsi-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Voice chat: microphone capture, Opus coding, jitter buffer, radio and distance effects, playback through omsi-audio"

[dependencies]
omsi-audio = { path = "../omsi-audio" }
omsi-cfg = { path = "../omsi-cfg" }
cpal = "0.15"
# libopus transpiled to Rust (BSD-3-Clause, the codec's own licence): builds with plain cargo
# on every platform, no C compiler, cmake or system library needed
unsafe-libopus = "0.2"
parking_lot.workspace = true
glam.workspace = true
log.workspace = true

[dev-dependencies]
omsi-net = { path = "../omsi-net" }
env_logger.workspace = true
