name: Publish 2.1.7 fuel fix to Cloudflare
on:
  push:
    branches: ['hotfix/2.1.7-fuel']
    paths: ['hotfix217/**', '.github/workflows/fuel-217-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Check native Windows fuel parsing and startup arguments
        shell: bash
        run: |
          python - <<'PY'
          import sys, subprocess, os
          sys.path.insert(0,'scripts'); import build
          files=[*build.TEST_COMMON,'process_windows.go','company_host_process_windows.go','openomsi_probe_windows.go',*build.TEST_FILES,'company_host_process_windows_test.go']
          env=dict(os.environ,GO111MODULE='off',CGO_ENABLED='0')
          subprocess.run(['go','test','-count=1','-run','TestPeDePeFuel|TestPeDePeFreshSituation|TestPeDePeSavedPosition',*files],cwd='source',env=env,check=True)
          PY
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify prebuilt updater and publisher signature
        run: |
          python3 hotfix217/reconstruct.py
          node update-service/publication.mjs prepare hotfix217/Atualizar-Bridge.exe
          node --test update-service/worker*.test.mjs
      - name: Publish the 2.1 update service
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify live signed manifest and installer
        run: node update-service/publication.mjs verify-live
