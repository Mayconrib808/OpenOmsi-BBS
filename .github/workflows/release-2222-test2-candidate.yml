name: Build 2.2.2.2 TEST 2 - body surface clothing and one-click updater
on:
  push:
    branches: [fix/2222-test2-clothes-updater]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: release-2222-test2-candidate
  cancel-in-progress: true
jobs:
  updater:
    name: Windows updater handoff and temporary lock regressions
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Test the actual updater source list and Windows child processes
        run: python scripts/test_2222_test2_updater.py
  native:
    name: Build corrected test 2 client and P15 server
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      OPENOMSI_VERSION: 0.3.46-coop.15-2.2.2.2-test.2
      OPENOMSI_COOP_GAME_ONLY: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      TAURI_CONFIG: '{"version":"0.3.46"}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 176f9a140b4b7b929464a639176ee012a86868de
          path: native-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-source
          key: winter-test1-native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.2-Test1-native-windows-CANDIDATE
          run-id: 41332662675
          github-token: ${{ github.token }}
          path: previous
      - name: Preserve exact licensed garments from test 1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='previous/OpenOMSI-winter-test1-native.zip'
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()){throw 'Damaged test 1 archive'}
          Expand-Archive -LiteralPath $zip -DestinationPath native -Force
          $info=Get-Content native/BUILD-INFO.json -Raw | ConvertFrom-Json
          if($info.source_commit -ne '9c78f21cf5a4269a68ff5e8819d127e42108a37c'){throw 'Wrong test 1 native baseline'}
          foreach($file in Get-ChildItem native/bcs-assets/WinterClothes -Filter skin_binding.json -Recurse){
            $binding=Get-Content $file.FullName -Raw | ConvertFrom-Json
            if($binding.fitted_to_stock_omsi_human -or $binding.released){throw 'Unexpected visual approval'}
          }
      - name: Test real garment parsing, fit bounds and final body surface motion
        working-directory: native-source
        shell: pwsh
        env:
          OPENOMSI_WINTER_TEST_ASSETS: ${{ github.workspace }}/native
        run: |
          Remove-Item Env:OPENOMSI_WINTER_TEST_PREVIEW -ErrorAction SilentlyContinue
          cargo test --locked -p omsi-app winter:: -- --nocapture
          if($LASTEXITCODE -ne 0){throw 'Winter/body attachment regressions failed'}
          node --test launcher/tests/optional-features.test.mjs
          if($LASTEXITCODE -ne 0){throw 'Optional settings regression failed'}
      - name: Build explicitly opt-in native test 2
        working-directory: native-source
        shell: pwsh
        env:
          OPENOMSI_WINTER_TEST_PREVIEW: '1'
        run: |
          cargo build --locked --release -p omsi-app
          if($LASTEXITCODE -ne 0){throw 'Native compilation failed'}
          & ./target/release/openomsi.exe --version
          if($LASTEXITCODE -ne 0){throw 'Native CLI failed'}
      - name: Archive exact native source and record this run
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item native-source/target/release/openomsi.exe native/openomsi.exe -Force
          git -C native-source archive --format=tar.gz --prefix=openomsi-test2/ -o ../native/openomsi-source.tar.gz HEAD
          if($LASTEXITCODE -ne 0){throw 'Native source archive failed'}
          & ./native-source/target/release/openomsi.exe --version | Out-File native/version.txt -Encoding utf8
          if($LASTEXITCODE -ne 0){throw 'Native version smoke failed'}
          @'
          import hashlib,json,os
          from pathlib import Path
          d=Path('native');commit='176f9a140b4b7b929464a639176ee012a86868de'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          version='0.3.46-coop.15-2.2.2.2-test.2'
          assert version in (d/'version.txt').read_text(encoding='utf-8-sig')
          info=dict(commit=commit,build_commit=commit,run_id=int(os.environ['GITHUB_RUN_ID']),
              upstream_commit='17be22987d7c01c813a1473e7696fc71fb3b1d89',version=version,
              native_sha256=sha(d/'openomsi.exe'),source_sha256=sha(d/'openomsi-source.tar.gz'),
              windows_gameplay_tested=False,gameplay_visual_tested=False,paired_gameplay_tested=False,
              winter_preview_compiled=True,weather_clothing_opt_in_required=True,winter_visual_approved=False,
              body_surface_attachment=True)
          (d/'SOURCE.json').write_text(json.dumps(info,indent=2)+'\n')
          (d/'BUILD-INFO.json').write_text(json.dumps(info,indent=2)+'\n')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Native provenance invalid'}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOMSI-2.2.2.2-Test2-native-windows-CANDIDATE
          path: native/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
  bridge:
    name: Assemble cumulative test 2 and test a real first-attempt update
    needs: [updater, native]
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.2-Test2-native-windows-CANDIDATE
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.2-desktop-launcher-CANDIDATE
          run-id: 41260965494
          github-token: ${{ github.token }}
          path: tested-launcher
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2-native-Windows
          run-id: 41157142308
          github-token: ${{ github.token }}
          path: prior-native
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix3-candidate
          run-id: 40901236438
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix2-candidate
          run-id: 40765546864
          github-token: ${{ github.token }}
          path: parts
      - name: Verify exact retained launcher and DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='tested-launcher/OpenOMSI-2.2.2.2-launcher-candidate.zip'
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()){throw 'Launcher checksum mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath launcher -Force
          Get-ChildItem prior-native -Filter '*.dll' | Copy-Item -Destination native
          & ./native/openomsi.exe --version
          if($LASTEXITCODE -ne 0){throw 'Staged game with retained DLLs failed'}
      - name: Build Bridge and matching client/server, preserve complete hosts, run first-attempt installation
        shell: pwsh
        run: |
          python scripts/build_2222_test2.py --baseline baseline --parts parts --native native --launcher launcher --output build/release2222-test2
          if($LASTEXITCODE -ne 0){throw 'Cumulative build, Windows GUI or first-attempt update failed'}
      - name: Verify test 2 final inventory
        shell: pwsh
        run: |
          @'
          import json,hashlib
          from pathlib import Path
          p=Path('build/release2222-test2')
          r=json.loads((p/'build-report.json').read_text())
          s=json.loads((p/'coop-spec.json').read_text())
          actual=json.loads((p/'one-click-install-test.json').read_text())
          assert r['version']=='2.2.2.2-test.2' and r['sequence']==2026110102
          assert r['complete_hosts_unchanged'] and not r['complete_hosts_rebuilt'] and r['p14_server_unchanged']
          assert r['actual_updater_first_attempt_windows_tested'] and actual['invocations']==1 and actual['status']=='passed'
          assert r['native_build_commit']=='176f9a140b4b7b929464a639176ee012a86868de'
          assert s['files']['OpenOmsi Coop 0.3.41/programa/openomsi.exe']==s['files']['app/server-dinamico-p15/openomsi.exe']
          assert r['per_release_changelog_including_hotfixes'] and r['setup_changelog_ui_tested']
          assert not r['windows_gameplay_tested'] and not r['winter_visual_approved']
          assert hashlib.sha256((p/'Atualizar-Bridge.exe').read_bytes()).hexdigest()==r['updater_sha256']
          print('TEST 2 CANDIDATE READY. Gameplay visual confirmation and signed-feed promotion remain pending.')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Final candidate inventory invalid'}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Bridge-Test2-FAILURE-DIAGNOSTICS
          path: |
            build/release2222-test2/one-click-install-setup.log
            build/release2222-test2/runtime/app/setup-v1.1.3.log
            build/release2222-test2/setup-previews/*
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2.2-Test2-CANDIDATE
          path: |
            build/release2222-test2/Atualizar-Bridge.exe
            build/release2222-test2/build-report.json
            build/release2222-test2/coop-spec.json
            build/release2222-test2/coop_bundle_manifest.go
            build/release2222-test2/coop-assets/*
            build/release2222-test2/native-help.txt
            build/release2222-test2/one-click-install-test.json
            build/release2222-test2/one-click-install-setup.log
            build/release2222-test2/setup-previews/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
