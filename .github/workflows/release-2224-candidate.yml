name: Build 2.2.2.4-hotfix.2 - P16 runtime and passenger signals
'on':
  push:
    branches:
    - fix/2224-engine0347
    - fix/2225-p16-runtime-dlls
    - fix/2224-hotfix1-p16-hail-release
    - fix/2224-hotfix2-v2-voice-integrity
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: release-2224-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  updater:
    name: Windows x64 updater process and lock regressions
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.2
        cache: false
    - name: Test actual shipped updater source list
      shell: pwsh
      run: |-
        python scripts/test_2222_test2_updater.py
        if($LASTEXITCODE -ne 0){throw 'Updater tests failed'}
  native:
    name: Reuse tested 0.3.47 P16 binary and archived sources
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-Final-native-CANDIDATE
        run-id: 41528869591
        github-token: ${{ github.token }}
        path: native
    - name: Verify matching native source, SHA and version without recompiling game
      shell: pwsh
      run: |-
        @'
        import json,hashlib
        from pathlib import Path
        p=Path('native');j=json.loads((p/'SOURCE.json').read_text())
        assert j['run_id']==41528869591 and j['commit']=='b15541549872aaee2dcd2d1be645bec978324495'
        assert j['build_commit']==j['commit'] and j['version']=='0.3.47-coop.16-2.2.2.4'
        assert hashlib.sha256((p/'openomsi.exe').read_bytes()).hexdigest()==j['native_sha256']
        assert hashlib.sha256((p/'openomsi-source.tar.gz').read_bytes()).hexdigest()==j['source_sha256']
        assert not (p/'bcs-assets/WinterClothes').exists()
        assert len(list((p/'bcs-assets/PassengerVoices/pt-BR').glob('*.wav')))==8
        '@ | python -
        if($LASTEXITCODE -ne 0){throw 'Pinned native artifact mismatch'}
    - uses: actions/upload-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-HF2-native-CANDIDATE
        path: native/
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
  launcher:
    name: Reuse tested 0.3.47 P16 launcher with all settings
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-Final-launcher-CANDIDATE
        run-id: 41528869591
        github-token: ${{ github.token }}
        path: launcher
    - name: Verify launcher SHA/source/controls
      shell: pwsh
      run: |-
        @'
        import json,hashlib
        from pathlib import Path
        p=Path('launcher');j=json.loads((p/'BUILD-INFO.json').read_text())
        exe=p/'openomsi-launcher-app.exe'
        assert j['version']=='0.3.47-coop.16-2.2.2.4' and j['source_commit']=='b15541549872aaee2dcd2d1be645bec978324495'
        assert j['optional_ui_controls']==12 and j['passenger_upstream_controls']==3
        assert hashlib.sha256(exe.read_bytes()).hexdigest()==j['launcher_sha256']
        '@ | python -
        if($LASTEXITCODE -ne 0){throw 'Pinned launcher artifact mismatch'}
    - uses: actions/upload-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-HF2-launcher-CANDIDATE
        path: launcher/
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
  bridge:
    name: Cumulative installer and first full-runtime replacement
    needs:
    - native
    - launcher
    - updater
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version: 1.23.2
        cache: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-HF2-native-CANDIDATE
        path: native
    - uses: actions/download-artifact@v4
      with:
        name: OpenOMSI-2.2.2.4-HF2-launcher-CANDIDATE
        path: launcher
    - uses: actions/download-artifact@v4
      with:
        name: OpenOMSI-2.2.2-native-Windows
        path: prior-native
        run-id: 41157142308
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@v4
      with:
        name: Bridge-2.2.2.3-Final-CANDIDATE
        path: baseline
        run-id: 41439660434
        github-token: ${{ github.token }}
    - name: Stage retained DLLs and build cumulative updater
      shell: pwsh
      run: |-
        Get-ChildItem prior-native -Filter '*.dll' | Copy-Item -Destination native
        python scripts/build_2224.py --baseline baseline --parts baseline --native native --launcher launcher --output build/release2224
        if($LASTEXITCODE -ne 0){throw 'Build, UI, inventory or real full-runtime first update failed'}
    - name: Validate first-attempt full runtime replacement and retained hosts
      shell: pwsh
      run: |-
        @'
        import json
        from pathlib import Path
        p=Path('build/release2224')
        r=json.loads((p/'build-report.json').read_text())
        t=json.loads((p/'one-click-install-test.json').read_text())
        assert r['version']=='2.2.2.4-hotfix.2' and r['winter_clothing_removed']
        assert r['complete_hosts_unchanged'] and not r['complete_hosts_rebuilt'] and r['p14_server_unchanged'] and r['p15_server_unchanged']
        assert r['native_version']=='0.3.47-coop.16-2.2.2.4' and r['coop_protocol']==16 and r['new_p16_host_ui_tested']
        assert r['brazilian_passenger_recordings']==8
        assert r['updater_architecture']=='amd64' and r['rollback_storage']=='disk'
        assert t['status']=='passed' and t['invocations']==1 and t['full_previous_runtime_replaced_bytes']>200<<20
        assert t['updater_architecture']=='amd64' and t['setup_reopened']
        assert not r['windows_gameplay_tested'] and not r['paired_gameplay_tested']
        print('CANDIDATE BUILT AND AUTOMATED TESTS PASSED. Manual gameplay and signed publication pending.')
        '@ | python -
        if($LASTEXITCODE -ne 0){throw 'Candidate inventory invalid'}
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Bridge-2224-FAILURE-DIAGNOSTICS
        path: |-
          build/release2224/one-click-install-setup.log
          build/release2224/runtime/app/setup-v1.1.3.log
          build/release2224/setup-previews/*
        if-no-files-found: warn
        retention-days: 14
    - uses: actions/upload-artifact@v4
      with:
        name: Bridge-2.2.2.4-hotfix.2-CANDIDATE
        path: |-
          build/release2224/Atualizar-Bridge.exe
          build/release2224/build-report.json
          build/release2224/coop-spec.json
          build/release2224/coop_bundle_manifest.go
          build/release2224/coop-assets/*
          build/release2224/native-help.txt
          build/release2224/native-p16-controls.json
          build/release2224/one-click-install-test.json
          build/release2224/one-click-install-setup.log
          build/release2224/setup-previews/*
        compression-level: 0
        retention-days: 30
        if-no-files-found: error
