name: Deploy update distribution
on:
  push:
    branches: ['release/2.1.0', 'release/2.1.9.5', 'release/2.1.9.6', 'release/2.1.9.7']
    paths: ['update-service/**', '.github/workflows/update-distribution.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read approved candidate reference
        id: publication
        run: |
          if test -f update-service/publication.json; then
            node -e 'const p=require("./update-service/publication.json"); if(!Number.isSafeInteger(p.candidate_run_id)||p.candidate_run_id<1)throw Error("Invalid candidate run");const n=p.artifact_name||"Bridge-2.1.2-update-candidate";if(!/^Bridge-[A-Za-z0-9.-]+$/.test(n))throw Error("Invalid artifact name");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"run_id="+p.candidate_run_id+"\nartifact_name="+n+"\n")'
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.publication.outputs.run_id != ''
        with:
          name: ${{ steps.publication.outputs.artifact_name }}
          run-id: ${{ steps.publication.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/approved-update
      - name: Verify signed manifest and installer
        if: steps.publication.outputs.run_id != ''
        run: |
          mapfile -t installers < <(find "${{ runner.temp }}/approved-update" -type f -name 'Atualizar-Bridge.exe')
          test "${#installers[@]}" -eq 1 || { echo '::error::Expected exactly one approved updater'; exit 1; }
          node update-service/publication.mjs prepare "${installers[0]}"
      - name: Check existing Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Test distribution routes
        run: node --test update-service/worker*.test.mjs
      - name: Deploy the update service only
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify live manifest and download
        if: steps.publication.outputs.run_id != ''
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node update-service/publication.mjs verify-live; then exit 0; fi
            if test "$attempt" -lt 6; then sleep 5; fi
          done
          exit 1
