name: Test and publish 3.0 candidate
on:
  workflow_dispatch:
  push:
    branches: ["release/3.0.3-rc.1", main]
  pull_request:
    paths: ["multiplayer3/**", "docs/*3*", ".github/workflows/multiplayer3-release.yml"]
permissions:
  contents: read
concurrency:
  group: multiplayer3-preview-release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - run: go test ./...
        working-directory: multiplayer3/source
      - run: go vet ./...
        working-directory: multiplayer3/source
      - run: node --test relay/test/multiplayer3.test.js relay/test/room.test.js
        working-directory: multiplayer3
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/3.')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Recover the already published verified native runtime
        run: python multiplayer3/scripts/recover_preview_server.py
      - name: Build isolated 3.x complete package and updater
        run: python multiplayer3/scripts/build_preview.py --server multiplayer3/server --output build-v3 --source-commit ${{ github.sha }} --sequence 2026101403
      - name: Scan the exact candidate package and binaries
        shell: pwsh
        run: |
          $meta=Get-Content build-v3/BUILD-INFO.json|ConvertFrom-Json
          ./multiplayer3/scripts/scan_candidate.ps1 -PackagePath "build-v3/BBS-OpenOmsi-Multiplayer-$($meta.version)-teste.zip" -AdditionalPaths "build-v3/Atualizar-Multiplayer-$($meta.version).exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: multiplayer3-candidate-and-scan
          path: build-v3/
          if-no-files-found: ignore
      - name: Publish 3.x prerelease without changing stable/latest 2.x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python -c "import json; print(json.load(open('build-v3/BUILD-INFO.json'))['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release is preserved; use a new version for new binary bytes."
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "BBS+OpenOmsi Multiplayer $version — test preview" --notes-file multiplayer3/RELEASE-NOTES.md
          fi
          gh release upload "$tag" "build-v3/Atualizar-Multiplayer-$version.exe" "build-v3/BBS-OpenOmsi-Multiplayer-$version-teste.zip" "build-v3/BBS-OpenOmsi-Multiplayer-$version-arquivos-atualizacao.zip" build-v3/BUILD-INFO.json build-v3/*.sha256 build-v3/DEFENDER-REPORT.json
