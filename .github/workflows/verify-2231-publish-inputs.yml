name: Verify 2.2.3.1 signing inputs from passed Windows artifact
on:
  push:
    branches: [release-candidate/2231-final-p17]
    paths: [.github/workflows/verify-2231-publish-inputs.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  signing-inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin exactly approved 2.2.3.1 Windows run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const api=p=>JSON.parse(execFileSync('gh',['api',p],{encoding:'utf8'}));
          const r=api('repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/42116052029');
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!=='4a9f9c5bde053fcce92e100e65c544fb4163c9e7'||r.path!=='.github/workflows/build-2231.yml')throw Error('Wrong or failed Windows candidate');
          const a=api('repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/42116052029/artifacts').artifacts.find(x=>x.name==='Bridge-2.2.3.1-FULL-CANDIDATE');
          if(!a||a.id!==13457334107||a.digest!=='sha256:cbd0f2221a780b09433c4621b8f8158d235ef8226f0493cfbe798775ecec51ba'||a.expired)throw Error('Approved artifact digest mismatch');
          fs.mkdirSync('signing-inputs',{recursive:true});
          fs.writeFileSync('signing-inputs/approved-artifact.json',JSON.stringify({run_id:r.id,commit:r.head_sha,artifact_id:a.id,artifact_digest:a.digest,artifact_size:a.size_in_bytes},null,2)+'\n');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.3.1-FULL-CANDIDATE
          run-id: 42116052029
          github-token: ${{ github.token }}
          path: approved-new
      - name: Verify complete build identity and extract only safe public metadata
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const j=n=>JSON.parse(fs.readFileSync('approved-new/'+n,'utf8'));
          const report=j('build-report.json'),spec=j('coop-spec.json'),install=j('one-click-install-test.json'),host=j('native-p17-controls.json');
          const binary=fs.readFileSync('approved-new/Atualizar-Bridge.exe');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const required=['complete_hosts_unchanged','p16_hosts_unchanged','p16_server_unchanged','p17_host_ui_tested','setup_live_update_ui_tested','actual_updater_first_attempt_windows_tested','wheelchair_alt_request_persistent','wheelchair_occupied_bay_priority','custom_sounds_unchanged','bridge_regressions_tested'];
          for(const key of required)if(report[key]!==true)throw Error('Failed or absent gate '+key);
          if(report.version!=='2.2.3.1'||report.sequence!==2026110501||report.coop_protocol!==17||report.native_version!=='0.3.49-coop.17-2.2.3.1'||report.native_candidate_run!==42116052029||report.native_candidate_commit!=='4aa69dbc1e05e467cb519b19f4d656cec53dafc8')throw Error('Native version or provenance invalid');
          if(report.updater_sha256!==sha(binary)||report.installer_size!==binary.length||binary.length>25*1024*1024)throw Error('Wrong signed-installer bytes or size');
          if(report.coop_archive_sha256!==spec.sha256||report.wheelchair_nine_controller_cycles_passed!==9)throw Error('Cumulative archive or accessibility regression');
          if(install.status!=='passed'||host.status!=='passed')throw Error('Windows installer/HostAgent regression');
          const game='OpenOmsi Coop 0.3.41/programa/openomsi.exe',server='app/server-dinamico-p17/openomsi.exe',lobby='OpenOmsi Coop 0.3.41/programa/openomsi-launcher-app.exe';
          if(spec.files[game]!==report.native_client_sha256['openomsi.exe']||spec.files[game]!==spec.files[server]||spec.files[lobby]!==report.desktop_launcher_sha256)throw Error('Game/server/launcher mismatched');
          for(const part of spec.parts){
            const path='approved-new/coop-assets/'+part.sha256+'.bin';
            const data=fs.readFileSync(path);
            if(data.length!==part.size||sha(data)!==part.sha256)throw Error('Mismatched Coop archive part: '+part.sha256);
          }
          for(const name of ['build-report.json','coop-spec.json','one-click-install-test.json','native-p17-controls.json']){
            fs.copyFileSync('approved-new/'+name,'signing-inputs/'+name);
          }
          console.log('APPROVED PUBLICATION INPUTS',JSON.stringify({version:report.version,sequence:report.sequence,installer_sha256:report.updater_sha256,installer_size:report.installer_size,coop_archive_sha256:spec.sha256,parts:spec.parts.length,files:Object.keys(spec.files).length,portable_sha256:report.portable_sha256,portable_size:report.portable_size}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.3.1-SIGNING-METADATA
          path: signing-inputs/
          retention-days: 90
          if-no-files-found: error
