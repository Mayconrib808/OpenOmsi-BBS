name: 0.3.47 passenger hailing regression candidate
on:
  push:
    branches: [fix/0347-hail-moving-target-priority]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hail-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test hailing regression and mirrored passengers
        shell: pwsh
        run: |
          cargo test --locked -p omsi-sim visual_hail -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Visual hail tests failed' }
          cargo test --locked -p omsi-sim approaching_service_outranks_closer_parked_service -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Parked-service masking regression failed' }
          cargo test --locked -p omsi-sim people::demand -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Demand bounds, refusal retry or queue tests failed' }
      - name: Build native openOMSI 0.3.47 game candidate
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-app --bin openomsi
          if ($LASTEXITCODE -ne 0) { throw 'Native game build failed' }
          if (!(Test-Path target/release/openomsi.exe)) { throw 'Native executable missing' }
          Get-FileHash target/release/openomsi.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: openOMSI-0347-hail-moving-priority-NATIVE-CANDIDATE
          path: target/release/openomsi.exe
          if-no-files-found: error
          retention-days: 14
