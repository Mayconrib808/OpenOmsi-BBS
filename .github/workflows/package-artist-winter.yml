name: Package artist-made winter garments for visual tests only
on:
  push:
    branches: [feat/winter-artist-assets]
    paths:
      - scripts/package_artist_winter_clothes.py
      - .github/workflows/package-artist-winter.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: package-artist-winter-candidate
  cancel-in-progress: true
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download previously verified artist asset conversion results
        uses: actions/download-artifact@v4
        with:
          name: retargeted-winter-clothes-shirts01-NEEDS-GAME-TEST
          run-id: 41257481971
          github-token: ${{ github.token }}
          path: staging/shirts01
      - uses: actions/download-artifact@v4
        with:
          name: retargeted-winter-clothes-shirts02-NEEDS-GAME-TEST
          run-id: 41257481971
          github-token: ${{ github.token }}
          path: staging/shirts02
      - uses: actions/download-artifact@v4
        with:
          name: retargeted-winter-clothes-gloves01-NEEDS-GAME-TEST
          run-id: 41257481971
          github-token: ${{ github.token }}
          path: staging/gloves01
      - uses: actions/download-artifact@v4
        with:
          name: retargeted-winter-clothes-hats03-NEEDS-GAME-TEST
          run-id: 41257481971
          github-token: ${{ github.token }}
          path: staging/hats03
      - name: Validate textures, UVs, rigging metadata and attribution
        run: python scripts/package_artist_winter_clothes.py --source staging --output candidate
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOMSI-Bridge-WinterClothes-REAL-ARTIST-MODELS-TEST-ONLY
          path: candidate/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
