name: Source checks

on:
  push:
    branches-ignore: ['codex/2.0.5-dev.3-timeout', 'codex/official-server-adapter']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-server:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and patch pinned openOMSI source
        run: python scripts/build_native_server.py --prepare-only
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/native-source
          shared-key: bbs-free-server-v1
      - name: Native free-bus, server and protocol regressions; build dedicated server
        run: python scripts/build_native_server.py --build-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BBS-free-bus-native-server
          path: build/native-server/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  check:
    needs: native-server
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Directory protocol regressions
        run: node --test relay/test/room.test.js
      - name: Checks on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/build.py --check-only
      - name: Download this run's tested native server
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: BBS-free-bus-native-server
          path: build/native-server
      - name: Complete package and native DLL tests on Windows
        id: windows_build
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/build.py --native-server build/native-server
      - name: Microsoft Defender scan of candidate ZIP and all executable files
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/scan_release_package.ps1 -PackagePath 'dist/OpenOmsi.+.BBS.${{ steps.windows_build.outputs.version }}.zip'
      - name: Upload complete bridge ZIP and checksum
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenOMSI-BCS-Bridge-v${{ steps.windows_build.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload Defender scan evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Defender-package-report
          path: ${{ runner.temp }}/openomsi-defender-report/*
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload native Setup previews
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Setup-Windows-previews
          path: build/setup-previews/*.png
          if-no-files-found: ignore
          retention-days: 30

  publish-development:
    needs: [native-server, check]
    if: github.event_name == 'push' && github.repository == 'Mayconrib808/OpenOmsi-BBS' && github.ref == 'refs/heads/codex/2.0.3-dev.3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the checked 2.0.3 dev3 prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_dev_release.py --run-id '${{ github.run_id }}' --commit '${{ github.sha }}' --artifact-dir '${{ runner.temp }}/development-release'
