name: Publish 2.1.6 helper fix to Cloudflare
on:
  push:
    branches: ['hotfix/2.1.6-plugin-host']
    paths: ['hotfix216/**', '.github/workflows/plugin-host-216-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify prebuilt updater and publisher signature
        run: |
          python3 hotfix216/reconstruct.py
          node update-service/publication.mjs prepare hotfix216/Atualizar-Bridge.exe
          node --test update-service/worker*.test.mjs
      - name: Publish the 2.1 update service
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify the live signed manifest and download
        run: node update-service/publication.mjs verify-live
