name: Build Bridge 2.2.1.9 hotfix 1 umbrella installer
on:
  push:
    branches: [release/2.2.1.9-hotfix.1]
    paths: [.github/workflows/release-2219-water-hotfix.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the pinned native game build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i=0; $i -lt 300; $i++) {
            $run = gh api repos/Mayconrib808/OpenOmsi-BBS/actions/runs/40602798735 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect native build" }
            if ($run.head_sha -ne '942e03a65254580064898b472e0e11619261fb84') { throw "Wrong native build commit" }
            if ($run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw "Native build failed" }
              break
            }
            if ($i -eq 299) { throw "Native build timeout" }
            Start-Sleep -Seconds 20
          }
          $base = gh api repos/Mayconrib808/OpenOmsi-BBS/actions/runs/40590327114 | ConvertFrom-Json
          if ($base.head_sha -ne 'f16ca511984084b13e97fbd911b22e3608e8daaa' -or $base.conclusion -ne 'success') { throw "Wrong retained cumulative hotfix" }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix1-native
          run-id: 40602798735
          github-token: ${{ github.token }}
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-candidate
          run-id: 40590327114
          github-token: ${{ github.token }}
          path: prior
      - name: Build installer and verify retained runtime and actual host controls
        shell: pwsh
        run: |
          python scripts/build_2219_water_hotfix.py --prior prior --native native
          if ($LASTEXITCODE -ne 0) { throw "Camera installer build or preservation audit failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix1-candidate
          path: |
            build/release-2219-hotfix1/Atualizar-Bridge.exe
            build/release-2219-hotfix1/build-report.json
            build/release-2219-hotfix1/coop-spec.json
            build/release-2219-hotfix1/coop-assets/**
            build/release-2219-hotfix1/coop_bundle_manifest.go
            build/release-2219-hotfix1/native-cli-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload small release report
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix1-report
          path: build/release-2219-hotfix1/build-report.json
          if-no-files-found: error
          retention-days: 30
