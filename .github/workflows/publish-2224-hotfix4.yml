name: Publish signed Bridge 2.2.2.4-hotfix.4 cumulative update
on:
  push:
    branches: [release/2.2.2.4-hotfix.4]
    paths: [build-support/release2224-hotfix4/stable.json, build-support/release2224-hotfix4/publish-trigger.txt]
permissions:
  contents: read
  actions: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "Verify approved full hotfix.3: newly rebuilt native game/P16, host profiles and updater"
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const p=require('./build-support/release2224-hotfix4/publication.json');
          const r=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+p.candidate_run_id],{encoding:'utf8'}));
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==p.candidate_commit||r.path!=='.github/workflows/integrate-2224-hotfix4.yml')throw Error('Wrong or failed opt-in test release candidate');
          const arts=JSON.parse(execFileSync('gh',['api','repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+p.candidate_run_id+'/artifacts'],{encoding:'utf8'})).artifacts;
          const art=arts.find(a=>a.name==='Bridge-2.2.2.4-hotfix.4-FULL-CANDIDATE');
          if(!art||art.id!==p.candidate_artifact_id||art.digest!=='sha256:'+p.candidate_artifact_sha256||art.expired)throw Error('Hotfix artifact ID/digest does not match approved Windows candidate');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_id='+p.candidate_run_id+'\n');
          NODE
      - name: Check publisher syntax and preflight all signed releases
        run: |
          node --check build-support/release2224-hotfix4/publication.mjs
          node build-support/release2224-hotfix4/publication.mjs validate-signatures
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.2.4-hotfix.4-FULL-CANDIDATE
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: approved-new
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.2.4-hotfix.3-FULL-CANDIDATE
          run-id: 41583888736
          github-token: ${{ github.token }}
          path: approved-prior2224hf3
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.2.4-hotfix.2-CANDIDATE
          run-id: 41539618533
          github-token: ${{ github.token }}
