      - name: Check signature, immutable historical assets, installer, Coop and rollback baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node build-support/release2224-hotfix4/publication.mjs prepare
      - name: Existing update worker regression tests
        run: node --test update-service/worker*.test.mjs
      - name: Deploy signed HOTFIX 4 only after verifying signed 2.2.2.4-hotfix.2 production baseline
        working-directory: distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify signed live manifest and new/previous package hashes
        run: |
          for attempt in $(seq 1 12); do
            if node build-support/release2224-hotfix4/publication.mjs verify-live; then exit 0; fi
            test "$attempt" -lt 12 || exit 1
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bridge-2.2.2.4-hotfix.4-live-evidence
          path: |
            build-support/release2224-hotfix4/stable.json
            build-support/release2224-hotfix4/publication.json
            approved-new/build-report.json
            approved-new/coop-spec.json
            approved-new/native-p16-controls.json
          retention-days: 30
          if-no-files-found: warn
