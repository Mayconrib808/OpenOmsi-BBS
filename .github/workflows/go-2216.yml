name: Fast 2.2.1.6 Bridge regression checks
'on':
  push:
    branches:
      - release/2.2.1.6
    paths:
      - source/**
      - scripts/build_2203.py
      - scripts/build.py
      - .github/workflows/go-2216.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bridge:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false
      - name: All existing BCS, clock, host, tickets and update tests
        run: python scripts/build_2203.py --tests-only
      - name: Company admin-clock and existing BCS guards
        shell: pwsh
        run: |
          Write-Host 'The full Go test harness includes TestNativeAdminClockOverrideAcceptedOnlyForManagedSyncedWorld and TestAdminClockOverrideNeverRollsBackAuthenticatedServerTime.'
