name: Wheelchair beta 1 - native Windows test package
on:
  push:
    branches: [beta/wheelchair-boarding-1]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: wheelchair-beta-${{ github.sha }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      OPENOMSI_VERSION: 0.3.47-coop.16-wheelchair-beta.1
      OPENOMSI_COOP_GAME_ONLY: '1'
      OPENOMSI_WHEELCHAIR_BETA: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      OMSI_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: visual-hail-route-2225
      - name: Accessibility state machine, mesh validity and simulation regression
        shell: pwsh
        run: |
          cargo test --locked --release -p omsi-sim --lib
          if ($LASTEXITCODE -ne 0) { throw 'Simulation tests failed' }
      - name: Build native P16 game and check executable entry point
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-app
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          & target/release/openomsi.exe --help | Out-File native-help.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native executable failed to start' }
      - name: Package isolated accessibility beta with install and rollback
        shell: pwsh
        run: |
          python scripts/package_wheelchair_beta.py --binary target/release/openomsi.exe --out dist
          if ($LASTEXITCODE -ne 0) { throw 'Beta packaging failed' }
      - name: Check installation and rollback without replacing the stable game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dist/OpenOMSI-Cadeirantes-Beta1-Windows-x64.zip -DestinationPath install-test
          $kit = Join-Path $PWD 'install-test/OpenOMSI-Cadeirantes-Beta1'
          $root = Join-Path $env:RUNNER_TEMP 'omsi-wheelchair-install-fixture'
          New-Item -ItemType Directory -Path (Join-Path $root 'maps'),(Join-Path $root 'Vehicles/2007 Marcopolo Torino OF 1722M') -Force | Out-Null
          'original-omsi' | Set-Content (Join-Path $root 'Omsi.exe')
          'stable-native-retained' | Set-Content (Join-Path $root 'openomsi.exe')
          $profile = Join-Path $root 'Vehicles/2007 Marcopolo Torino OF 1722M/wheelchair.json'
          'prior-profile-retained' | Set-Content $profile
          & (Join-Path $kit 'Instalar_Beta.ps1') -OmsiRoot $root -NoOpen
          if ($LASTEXITCODE -ne 0) { throw 'Beta installation failed' }
          if ((Get-Content (Join-Path $root 'openomsi.exe') -Raw).Trim() -ne 'stable-native-retained') { throw 'Stable executable changed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'BridgeWheelchairBeta/Instalar_Beta.ps1') -Uninstall -NoOpen
          if ($LASTEXITCODE -ne 0) { throw 'Beta uninstall failed' }
          if ((Get-Content $profile -Raw).Trim() -ne 'prior-profile-retained') { throw 'Original profile was not restored' }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOMSI-Cadeirantes-Beta1-Windows-x64
          path: dist/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  beta-download:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-Cadeirantes-Beta1-Windows-x64
          path: approved
      - name: Publish the tested isolated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/beta/wheelchair-boarding-1" --jq '.object.sha')
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "A newer beta commit is being tested; skipping publication."
            exit 0
          fi
          gh release create wheelchair-beta.1-20261103-r2 \
            approved/OpenOMSI-Cadeirantes-Beta1-Windows-x64.zip \
            approved/OpenOMSI-Cadeirantes-Beta1-fontes.zip \
            approved/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "OpenOMSI Cadeirantes - Beta 1" \
            --notes-file coop-assets/wheelchair-beta/RELEASE.md
