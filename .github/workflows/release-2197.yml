name: Build and validate Bridge 2.1.9.7

on:
  push:
    branches: ['release/2.1.9.7']
    paths: ['source/**', 'scripts/**', 'docs/releases/v2.1.9.7.md', '.github/workflows/release-2197.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-2197
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Lua, directory and distribution regressions
        shell: bash
        run: |
          python -m pip install lupa==2.8 cryptography==50.0.2
          python scripts/test_live_trip_plugin.py
          node --test relay/test/room.test.js
          node --test update-service/worker*.test.mjs
      - name: Official 0.3.38 server, private buses and authenticated reconnect
        run: python scripts/test_company_gateway_runtime.py --version 0.3.38
      - name: Previous 0.3.37 server remains compatible
        run: python scripts/test_company_gateway_runtime.py --version 0.3.37
      - name: Windows tests and vet
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts'); import build
          env = dict(os.environ, GO111MODULE='off', CGO_ENABLED='0', GOTOOLCHAIN='local')
          files = [*build.TEST_COMMON, 'process_windows.go', 'company_host_process_windows.go', 'openomsi_probe_windows.go', *build.TEST_FILES, 'company_host_process_windows_test.go']
          subprocess.run(['go', 'test', '-count=1', '-v', *files], cwd=build.SOURCE, env=env, check=True)
          subprocess.run(['go', 'vet', *files], cwd=build.SOURCE, env=env, check=True)
          PY
      - name: Build all update components and native GUI smoke checks
        shell: bash
        run: |
          python scripts/build_update_components.py --output build/update-components --update-origin https://openomsi-bbs-updates.maycongamesmaximo.workers.dev --update-sequence 2026101801
          build/update-components/HostAgent.exe --gui-smoke
          python scripts/test_pluginhost_windows.py build/update-components/app/compat/omsi-plugin-host32.exe
          python scripts/test_facade_windows.py build/update-components/app/compat/Omsi.exe
      - name: Build cumulative updater
        run: >-
          python scripts/build_bridge_update.py --package build/update-components
          --output build/update-2197/OpenOmsi_BBS_2.1.9.7_Atualizacao.zip
          --components build/update-2197/components
      - name: Record hashes
        shell: pwsh
        run: |
          $p='build/update-2197/Atualizar-Bridge.exe'
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
          $s=(Get-Item -LiteralPath $p).Length
          "Updater SHA-256: $h" | Set-Content build/update-2197/RELEASE-HASHES.txt
          "Updater size: $s" | Add-Content build/update-2197/RELEASE-HASHES.txt
          if ($s -gt 25*1024*1024) { throw 'Installer exceeds distribution asset limit' }
      - name: Prepare exact updater and component bytes for scanning
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib, pathlib, sys, zipfile
          sys.path.insert(0, 'scripts'); import build
          root = pathlib.Path('build/update-components')
          files = {name: root/name for name in [*build.PROGRAMS, build.HOST]}
          files['Atualizar-Bridge.exe'] = pathlib.Path('build/update-2197/Atualizar-Bridge.exe')
          target = pathlib.Path('build/update-2197/Defender-Input.zip')
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              manifest = ''
              for name, path in files.items():
                  z.write(path, name)
                  manifest += hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + name + '\n'
              z.writestr('docs/SHA256.txt', manifest)
          pathlib.Path(str(target)+'.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n')
          PYTHON
      - name: Defender scan
        continue-on-error: true
        shell: pwsh
        run: ./scripts/scan_release_package.ps1 -PackagePath 'build/update-2197/Defender-Input.zip' -UpdateOnly
      - name: Inspect Defender evidence
        shell: pwsh
        run: |
          $path=Join-Path '${{ runner.temp }}' 'openomsi-defender-report/report.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Missing Defender evidence' }
          $r=Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($r.status -eq 'clean_in_this_environment_not_a_microsoft_false_positive_ruling') { exit 0 }
          $limitations=@('Microsoft Defender scanner is unavailable.','Defender real-time/download/cloud protection is unavailable; no clean result can be claimed.','Defender cloud validation failed; publication is blocked.','The remote procedure call failed.')
          if ($r.status -eq 'inconclusive' -and $limitations -contains [string]$r.error) {
            Write-Warning ('Hosted runner scan inconclusive; no clean verdict is claimed: '+[string]$r.error)
            exit 0
          }
          throw ('Defender scan rejected the package: '+[string]$r.status+' '+[string]$r.error)
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Defender-2.1.9.7
          path: ${{ runner.temp }}/openomsi-defender-report/*
          if-no-files-found: ignore
      - name: Upload tested update candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bridge-2.1.9.7-update-candidate
          path: |
            build/update-2197/Atualizar-Bridge.exe
            build/update-2197/OpenOmsi_BBS_2.1.9.7_Atualizacao.zip
            build/update-2197/RELEASE-HASHES.txt
          if-no-files-found: error
          retention-days: 30
