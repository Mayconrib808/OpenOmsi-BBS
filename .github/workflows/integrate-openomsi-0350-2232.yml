name: Bridge 2.2.3.2 - full openOMSI 0.3.50/P17 integration (candidate, NOT published)
on:
  push:
    branches: [fix/2231-wheelchair-universal-hud-and-signal-reset]
    paths:
      - '.github/workflows/integrate-openomsi-0350-2232.yml'
      - 'tools/reconcile_openomsi_0350_bridge_2232.py'
      - 'crates/omsi-app/src/offscreen/**'
      - 'crates/omsi-app/src/app_events/frame/interface.rs'
      - 'crates/omsi-app/src/app_events/frame/people.rs'
      - 'crates/omsi-sim/src/people/wheelchair*'
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
concurrency:
  group: bridge-2232-full-0350-merge
  cancel-in-progress: false
jobs:
  merge-and-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    outputs:
      integrated_sha: ${{ steps.publish-source.outputs.integrated_sha }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: openomsi-0350-bridge-2232
      - name: Native Linux prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Merge every official v0.3.50 change onto the exact P17 Bridge source
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-0350-report
          git remote add official https://github.com/openOMSI-org/openOMSI.git
          base=0784e3cd02ea6fc013b31cdfff4a7932742632ca
          upstream=11ff78bab1998963162be97c49e909a2996710e1
          git fetch --no-tags official "$base" "$upstream"
          git merge-base --is-ancestor "$base" "$upstream" || { echo 'Upstream 0.3.50 is not based on pinned 0.3.49'; exit 1; }
          bridge_head=$(git rev-parse HEAD)
          echo "Bridge fixes source: $bridge_head" | tee integration-0350-report/provenance.txt
          echo "Official 0.3.50: $upstream" | tee -a integration-0350-report/provenance.txt
          bridge_tree=$(git rev-parse 'HEAD^{tree}')
          synthetic=$(printf 'Ephemeral Bridge 0.3.49/P17 comparison root\n' | git -c user.name='Bridge Integrator' -c user.email='integrator@localhost.invalid' commit-tree "$bridge_tree" -p "$base")
          git -c advice.detachedHead=false checkout --detach "$synthetic"
          set +e
          git -c user.name='Bridge Integrator' -c user.email='integrator@localhost.invalid' merge --no-ff --no-commit -X ours "$upstream" > integration-0350-report/merge.log 2>&1
          rc=$?
          set -e
          cat integration-0350-report/merge.log
          git diff --name-only --diff-filter=U | tee integration-0350-report/unresolved.txt
          git status --short > integration-0350-report/status.txt
          if [ "$rc" -ne 0 ] || [ -s integration-0350-report/unresolved.txt ]; then
            echo '::error::Upstream 0.3.50 merge needs manual reconciliation. NO distribution changes.'
            exit 1
          fi
          python3 tools/reconcile_openomsi_0350_bridge_2232.py
          git add -A
          git -c user.name='Bridge Integrator' -c user.email='integrator@localhost.invalid' commit -m 'Integrate official openOMSI 0.3.50 source with Bridge P17 accessibility and HostAgent fixes'
          git diff --stat "$synthetic" HEAD > integration-0350-report/upstream-integration-stat.txt
          git rev-parse HEAD | tee integration-0350-report/integrated-commit.txt
          echo "Integrated official 0.3.50 into the Bridge source candidate; compiler and behavioural tests still required."
      - name: Full P17 wheelchair, timetable, LAN and bridge simulation tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p omsi-sim --lib
          cargo test --locked -p omsi-net --lib
          cargo test --locked -p omsi-audio --lib
          cargo check --locked -p omsi-app -p omsi-lan -p omsi-launcher-core
          node --test launcher/tests/optional-features.test.mjs launcher/tests/nvidia-dlss-install.test.mjs
          python3 tools/check_accessibility_locales.py
      - name: Publish the tested merged source only (NOT signed release or updater feed)
        id: publish-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          # Each workflow run owns a unique immutable source ref. Avoid stale
          # --force-with-lease failures and never overwrite a prior tested tree.
          branch="integration/2232-openomsi0350-p17-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit:refs/heads/$branch"
          echo "integrated_sha=$commit" >> "$GITHUB_OUTPUT"
          echo "Published immutable candidate source ref $branch at $commit"
      - name: Upload integration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2232-openomsi0350-source-merge-audit
          path: integration-0350-report/
          retention-days: 45
          if-no-files-found: warn
  windows-native-and-launcher:
    needs: merge-and-tests
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      OPENOMSI_VERSION: 0.3.50-coop.17-2.2.3.2-candidate
      OPENOMSI_COOP_GAME_ONLY: '1'
      OMSI_NO_UPDATE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge-and-tests.outputs.integrated_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: 2232-0350-native-p17
      - name: Compile actual native game including full 0.3.50 code and P17 features
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-app
          if ($LASTEXITCODE -ne 0) { throw '0.3.50/P17 Windows game build failed' }
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item target/release/openomsi.exe candidate/openomsi.exe
          # The upstream Steamworks build links steam_api64.dll at load time.
          # The executable is tested from candidate/, not target/release/, so
          # preserve the exact repository-provided Steam redistributable beside
          # it; never download an unverified third-party DLL or skip the gate.
          $steamSource = 'assets/steam_redist/steam_api64.dll'
          if (!(Test-Path $steamSource -PathType Leaf)) {
            throw "Required official Steam redistributable missing from checked-out source: $steamSource"
          }
          Copy-Item $steamSource candidate/steam_api64.dll -ErrorAction Stop
          $steamSourceHash = (Get-FileHash $steamSource -Algorithm SHA256).Hash
          $steamCandidateHash = (Get-FileHash candidate/steam_api64.dll -Algorithm SHA256).Hash
          if ($steamSourceHash -ne $steamCandidateHash) { throw 'Steam DLL candidate hash differs from tracked source' }
          "steam_api64.dll SHA256: $($steamCandidateHash.ToLowerInvariant())" | Set-Content candidate/steam-runtime-provenance.txt -Encoding utf8
          # The release game is a Windows GUI-subsystem executable. PowerShell's
          # direct invocation does not reliably wait for its exit or capture
          # clap --help; use the updater's actual --self-test contract instead.
          $game = (Resolve-Path candidate/openomsi.exe).Path
          # 0xC0000135 means Windows loader could not find a required DLL.
          # Preserve an auditable dependency report instead of suppressing the gate.
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($dumpbin) {
            & $dumpbin /dependents $game 2>&1 | Out-File candidate/native-dependencies.txt -Encoding utf8
          } else {
            'dumpbin.exe unavailable on this runner' | Set-Content candidate/native-dependencies.txt
          }
          'PATH directories:' | Set-Content candidate/native-runtime-paths.txt
          $env:PATH -split ';' | Add-Content candidate/native-runtime-paths.txt
          'Nearby native DLLs:' | Add-Content candidate/native-runtime-paths.txt
          Get-ChildItem target/release -Filter '*.dll' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Add-Content candidate/native-runtime-paths.txt
          # Diagnose missing native imports without bypassing the self-test.
          $lookupDirs = @((Split-Path $game), (Join-Path $env:WINDIR 'System32')) + ($env:PATH -split ';')
          $lookupDirs = @($lookupDirs | Where-Object { $_ -and (Test-Path $_ -PathType Container) } | Select-Object -Unique)
          $imports = @()
          if ($dumpbin) {
            $imports = @(& $dumpbin /dependents $game 2>&1 | ForEach-Object {
              if ($_ -match '^\s*([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1] }
            } | Sort-Object -Unique)
          }
          $missing = @()
          foreach ($dll in $imports) {
            $resolved = $null
            foreach ($dir in $lookupDirs) {
              $candidate = Join-Path $dir $dll
              if (Test-Path $candidate -PathType Leaf) { $resolved = $candidate; break }
            }
            if ($resolved) {
              "FOUND $dll => $resolved" | Add-Content candidate/native-runtime-paths.txt
            } else {
              "NOT FOUND $dll" | Add-Content candidate/native-runtime-paths.txt
              if ($dll -notmatch '^(api-ms-win-|ext-ms-win-)') { $missing += $dll }
            }
          }
          if ($missing.Count -gt 0) {
            "Unresolved direct native imports: $($missing -join ', ')" | Set-Content candidate/native-self-test.txt
            throw "0.3.50/P17 missing direct Windows DLL dependencies: $($missing -join ', ')"
          }
          $probe = Start-Process -FilePath $game -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($null -eq $probe -or $probe.ExitCode -ne 0) {
            $hexExit = if ($null -eq $probe) { 'no-process' } else { '0x{0:X8}' -f ([uint32]([int64]$probe.ExitCode -band 0xffffffffL)) }
            "Native self-test failed: $hexExit. See native-dependencies.txt and native-runtime-paths.txt." | Set-Content candidate/native-self-test.txt
            throw "0.3.50/P17 native self-test failed ($hexExit); runtime DLL dependency diagnostics preserved"
          }
          "Native executable --self-test exit code: $($probe.ExitCode)" | Set-Content candidate/native-self-test.txt -Encoding utf8
      - name: Compile actual updated desktop launcher and CLI (not just core)
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-launcher-core --bin openomsi-launcher
          if ($LASTEXITCODE -ne 0) { throw '0.3.50 Windows launcher CLI compilation failed' }
          cargo build --locked --release --manifest-path launcher/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw '0.3.50 Windows desktop launcher compilation failed' }
          $desktop='launcher/src-tauri/target/release/openomsi-launcher-app.exe'
          if (!(Test-Path $desktop)) { throw 'Expected actual desktop launcher executable missing' }
          if (!(Test-Path 'target/release/openomsi-launcher.exe')) { throw 'Expected launcher CLI executable missing' }
          Copy-Item $desktop candidate/openomsi-launcher-app.exe -ErrorAction Stop
          Copy-Item target/release/openomsi-launcher.exe candidate/openomsi-launcher.exe -ErrorAction Stop
          @{
            version=$env:OPENOMSI_VERSION
            source_commit='${{ needs.merge-and-tests.outputs.integrated_sha }}'
            desktop_sha256=(Get-FileHash $desktop -Algorithm SHA256).Hash.ToLowerInvariant()
            cli_sha256=(Get-FileHash target/release/openomsi-launcher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            native_sha256=(Get-FileHash target/release/openomsi.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            validation='compiled-only-not-live-tested'
            protocol=17
          } | ConvertTo-Json | Set-Content candidate/BUILD-INFO.json -Encoding utf8
      - name: Preserve candidate proof and DLL diagnostics; no automatic publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2232-openomsi0350-P17-Windows-CANDIDATE
          path: candidate/
          retention-days: 60
          if-no-files-found: warn
