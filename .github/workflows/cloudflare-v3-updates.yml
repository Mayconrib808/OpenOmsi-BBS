name: Upload prebuilt 3.x updates to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-updates-v3
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Recover locally verified updater and complete package
        run: python3 cloudflare-updates-v3/reconstruct.py
      - name: Upload only to the isolated 3.x Cloudflare Worker
        working-directory: cloudflare-updates-v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Check Cloudflare publication
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64
          u='https://openomsi-bbs-updates-v3.maycongamesmaximo.workers.dev/preview.json'
          with urllib.request.urlopen(u,timeout=30) as r: envelope=json.load(r)
          release=json.loads(base64.b64decode(envelope['payload']))
          assert release['product']=='bbs-openomsi-multiplayer' and release['version'].startswith('3.')
          print('Cloudflare 3.x manifest is live:',release['version'])
          PY
