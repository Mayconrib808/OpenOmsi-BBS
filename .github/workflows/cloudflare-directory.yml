name: Deploy Cloudflare directory
on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-directory.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-directory-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated P16 and v3 directory
        uses: actions/checkout@v4
        with:
          ref: 34337821b692cdd3e57828cbdcece8c52761665b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test directory protocols
        working-directory: relay
        run: npm test
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          wranglerVersion: '4.149.0'
          command: deploy --config wrangler.jsonc
      - name: Verify live P16 and existing v3 routes
        working-directory: relay
        run: node verify-live.mjs
