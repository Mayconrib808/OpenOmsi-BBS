name: Compile 2.2.2 Setup and normal BCS capture
on:
  push:
    branches: [work/bridge-222-build]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bridge:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify embedded capture bytecode, archive upgrade and backups
        shell: pwsh
        run: |
          @'
          import os,subprocess,sys
          sys.path.insert(0,'scripts')
          import build
          env=dict(os.environ,GO111MODULE='off',GOTOOLCHAIN='local')
          files=build.TEST_COMMON+['process_teststub_test.go','company_host_process_windows.go','openomsi_probe_windows.go','bcs_trip_log_patch_test.go','bcs_capture_test.go']
          subprocess.run(['go','test','-count=1','-run','TestBCS','-v',*files],cwd='source',env=env,check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Capture integration regression failed' }
      - name: Compile Setup without rebuilding complete released hosts
        shell: pwsh
        run: |
          @'
          import os,subprocess,sys,shutil,tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build,setup_resources
          out=Path('bridge-check');out.mkdir()
          env=dict(os.environ,GOOS='windows',GOARCH='386',GO386='sse2',CGO_ENABLED='0',GO111MODULE='off',GOTOOLCHAIN='local')
          target=(out/'Setup.exe').resolve()
          with tempfile.TemporaryDirectory() as temp:
              work=Path(temp)
              for name in build.PROGRAMS['Setup.exe']:shutil.copy2(build.SOURCE/name,work/name)
              resources=setup_resources.prepare(work,build.SOURCE/'resources')
              (work/'go.mod').write_text('module setup-check\n\ngo 1.23.2\n')
              env['GO111MODULE']='on'
              subprocess.run(['go','build','-trimpath','-buildvcs=false','-ldflags=-s -w -H=windowsgui','-o',str(target),'.'],cwd=work,env=env,check=True)
              setup_resources.verify_executable(target,resources)
          preview=(out/'previews').resolve()
          smoke_env=dict(os.environ,BRIDGE_SETUP_PREVIEWS=str(preview))
          subprocess.run([str(target),'--gui-smoke'],env=smoke_env,cwd=out,timeout=60,check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2-Setup-compile-check
          path: bridge-check/*
          retention-days: 14
