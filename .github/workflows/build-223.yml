name: Build full Bridge 2.2.3 accessibility candidate on verified Hotfix 5
on:
  push:
    branches: [feature/2.2.3-build]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: bridge-223-candidate
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      OMSI_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify tested native source and matching desktop lobby
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          import json, os, subprocess
          from pathlib import Path
          p=json.loads(Path('build-support/release223/native-build.json').read_text(encoding='utf-8'))
          r=json.loads(subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{p['run_id']}"],text=True))
          assert r['status']=='completed' and r['conclusion']=='success', 'Native or lobby validation did not pass'
          assert r['head_sha']==p['commit'] and r['path']==p['workflow'], 'Unexpected native source or workflow'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8')as out:out.write('run_id='+str(p['run_id'])+'\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native accessibility gate failed' }
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.3-native-CANDIDATE
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.3-launcher-CANDIDATE
          run-id: ${{ steps.native.outputs.run_id }}
          github-token: ${{ github.token }}
          path: launcher
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.2.4-hotfix.5-FULL-CANDIDATE
          run-id: 41871370040
          github-token: ${{ github.token }}
          path: baseline
      - name: Build cumulative update and test actual retained hosts and updater
        shell: pwsh
        run: |
          python scripts/build_223.py --baseline baseline --parts baseline --native native --launcher launcher --output build/release223
          if ($LASTEXITCODE -ne 0) { throw 'Full Bridge 2.2.3 Windows validation failed' }
          Compress-Archive -Path build/release223/runtime/* -DestinationPath build/release223/OpenOMSI-BCS-Bridge-2.2.3-CANDIDATE.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable candidate archive failed' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Bridge-2.2.3-failure-diagnostics
          path: |
            build/release223/one-click-install-setup.log
            build/release223/runtime/app/setup-v1.1.3.log
            build/release223/setup-previews/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.3-FULL-CANDIDATE
          path: |
            build/release223/OpenOMSI-BCS-Bridge-2.2.3-CANDIDATE.zip
            build/release223/Atualizar-Bridge.exe
            build/release223/build-report.json
            build/release223/coop-spec.json
            build/release223/coop-assets/*
            build/release223/native-p16-controls.json
            build/release223/one-click-install-test.json
            build/release223/setup-previews/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
