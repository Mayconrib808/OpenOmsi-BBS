name: Bridge 2.2.0.2 character selection Windows
on:
  push:
    branches: ['release/2.2.0.2']
    paths: ['build-support/character/**', '.github/workflows/characters-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPENOMSI_VERSION: 0.3.38-coop.8
      OPENOMSI_COOP_GAME_ONLY: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: support
      - uses: actions/checkout@v7
        with:
          repository: openOMSI-org/openOMSI
          ref: 866c60de268f3fc8737287b8e2d13993c49b1f1f
          path: game
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: coop6-windows-msvc
          workspaces: |
            game -> target
            game/tools/coop-check -> target
      - name: Prepare corresponding source
        run: |
          python support/build-support/coop6/prepare.py
          python support/build-support/driver-share/prepare.py
          python support/build-support/character/prepare.py
      - name: Character persistence and cooperative regressions
        working-directory: game
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tools/coop-check/Cargo.toml 2>&1 | Tee-Object -FilePath ../out/regressions.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify selected figure with no bus on protocol 14
        working-directory: game
        shell: pwsh
        run: |
          cargo test --locked -p omsi-lan --lib walking_without_a_bus_keeps_the_players_chosen_character 2>&1 | Tee-Object -FilePath ../out/on-foot-network-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        working-directory: game
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p omsi-app --bin openomsi 2>&1 | Tee-Object -FilePath ../out/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/openomsi.exe ../out/openomsi.exe
      - name: Native Windows self-test
        working-directory: game
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/openomsi.exe'
          & $exe --version 2>&1 | Tee-Object -FilePath ../out/windows-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --self-test 2>&1 | Tee-Object -FilePath ../out/windows-self-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{passed=$true; graphical_gameplay_tested=$false; two_player_gameplay_tested=$false; protocol=14} | ConvertTo-Json | Set-Content ../out/windows-startup.json
      - name: Package complete corresponding source
        run: |
          python support/build-support/coop6/prepare.py package
          python -c "from pathlib import Path; Path('out/openomsi-coop6-source.zip').rename('out/openomsi-coop8-source.zip')"
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status=Get-MpComputerStatus
          if (-not $status.AntivirusEnabled) { throw 'Defender unavailable.' }
          $platform=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $scanner=if ($platform) {$platform.FullName} else {"$env:ProgramFiles/Windows Defender/MpCmdRun.exe"}
          & $scanner -SignatureUpdate 2>&1 | Out-File out/defender-update.log
          & $scanner -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE/out" -DisableRemediation 2>&1 | Tee-Object -FilePath out/defender-scan.log
          $code=$LASTEXITCODE
          $passed=$code -eq 0 -and (Get-Content out/defender-scan.log -Raw) -match 'found no threats|no threats found'
          @{status=$(if($passed){'passed'}else{'requires_review'}); exit_code=$code; engine=$status.AMEngineVersion; signatures=$status.AntivirusSignatureVersion} | ConvertTo-Json | Set-Content out/defender-report.json
          if (-not $passed) { throw 'Defender scan did not pass.' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bridge-2202-coop8-windows
          retention-days: 30
          if-no-files-found: error
          path: out/*
