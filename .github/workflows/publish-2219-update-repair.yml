name: Publish verified Bridge 2.2.1.9 hotfix 3 to Buscar atualizacoes
permissions:
  contents: write
  actions: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Confirm signed manifest and approved build identity
      id: candidate
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'node - <<''NODE''

        const fs=require(''fs''),{execFileSync}=require(''child_process''),p=require(''./build-support/bridge2219-hotfix3/publication.json'');

        const r=JSON.parse(execFileSync(''gh'',[''api'',''repos/''+process.env.GITHUB_REPOSITORY+''/actions/runs/''+p.candidate_run_id],{encoding:''utf8''}));

        if(r.status!==''completed''||r.conclusion!==''success''||r.head_sha!==p.candidate_commit||![''.github/workflows/build-2219-update-repair.yml''].includes(r.path))throw
        Error(''Invalid update candidate'');

        fs.appendFileSync(process.env.GITHUB_OUTPUT,''run_id=''+p.candidate_run_id+''\n'');

        NODE

        '
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.9-hotfix3-candidate
        run-id: ${{ steps.candidate.outputs.run_id }}
        github-token: ${{ github.token }}
        path: approved-new
    - uses: actions/download-artifact@v4
      with:
        name: Bridge-2.2.1.9-hotfix2-candidate
        run-id: 40765546864
        github-token: ${{ github.token }}
        path: approved-hotfix2
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.9-hotfix1-candidate
        run-id: 40602950335
        github-token: ${{ github.token }}
        path: approved-hotfix2219
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.9-candidate
        run-id: 40590327114
        github-token: ${{ github.token }}
        path: approved-prior2219
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.8-candidate
        run-id: 40526580430
        github-token: ${{ github.token }}
        path: approved-prior2218
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.8-hotfix1-candidate
        run-id: 40577793377
        github-token: ${{ github.token }}
        path: approved-hotfix2218
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.8-hotfix1-candidate
        run-id: 40149656930
        github-token: ${{ github.token }}
        path: approved-hf1
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.8-hotfix2-candidate
        run-id: 40197474614
        github-token: ${{ github.token }}
        path: approved-hf2
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.8-update-candidate
        run-id: 40139360336
        github-token: ${{ github.token }}
        path: approved-prior2208
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.7-candidate
        run-id: 40121432530
        github-token: ${{ github.token }}
        path: approved-prior2207
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.1-approved-publication
        run-id: 39795944956
        github-token: ${{ github.token }}
        path: approved-previous
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.2-update-candidate
        run-id: 39863166328
        github-token: ${{ github.token }}
        path: approved-previous2
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.3-update-candidate
        run-id: 39973561655
        github-token: ${{ github.token }}
        path: approved-base
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.3-hotfix.2-candidate
        run-id: 39992267151
        github-token: ${{ github.token }}
        path: approved-hotfix
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.4-candidate
        run-id: 40017148265
        github-token: ${{ github.token }}
        path: approved-prior2204
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.5-candidate
        run-id: 40056968283
        github-token: ${{ github.token }}
        path: approved-prior2205
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.6-candidate
        run-id: 40097453331
        github-token: ${{ github.token }}
        path: approved-prior2206
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.6-candidate
        run-id: 40106329076
        github-token: ${{ github.token }}
        path: approved-prior22061
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.6-candidate
        run-id: 40110829067
        github-token: ${{ github.token }}
        path: approved-prior22062
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.0.8-hotfix3-candidate
        run-id: 40199374831
        github-token: ${{ github.token }}
        path: approved-hf3
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1-candidate
        run-id: 40228211729
        github-token: ${{ github.token }}
        path: approved-prior221
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.1-candidate
        run-id: 40242642374
        github-token: ${{ github.token }}
        path: approved-prior2211
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.2-candidate
        run-id: 40249678167
        github-token: ${{ github.token }}
        path: approved-prior2212
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.3-candidate
        run-id: 40261480962
        github-token: ${{ github.token }}
        path: approved-prior2213
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.4-candidate
        run-id: 40363087739
        github-token: ${{ github.token }}
        path: approved-prior2214
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.6-candidate
        run-id: 40409878722
        github-token: ${{ github.token }}
        path: approved-prior2216
    - uses: actions/download-artifact@v8
      with:
        name: Bridge-2.2.1.7-candidate
        run-id: 40452388183
        github-token: ${{ github.token }}
        path: approved-prior2217
    - name: Verify original publisher's Ed25519 signature, new installer and all old static assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: node build-support/bridge2219-hotfix3/publication.mjs prepare
    - name: Existing Worker regression tests
      run: node --test update-service/worker*.test.mjs
    - name: Publish to production Cloudflare Worker used by Setup
      working-directory: distribution
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: 'test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1

        npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc

        '
    - name: Verify live update manifest, EXE and native Coop package chunks
      run: "for attempt in $(seq 1 12); do\n  if node build-support/bridge2219-hotfix3/publication.mjs verify-live; then\
        \ exit 0; fi\n  test \"$attempt\" -lt 12 || exit 1\n  sleep 5\ndone\n"
    - name: Download the authenticated public baseline and create the repaired full ZIP
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download v2.2.1.9 --repo "$GITHUB_REPOSITORY" --pattern OpenOMSI_BCS_Bridge_2.2.1.9.zip --dir original-public-zip
        python3 scripts/package_2219_update_repair.py --basezip original-public-zip/OpenOMSI_BCS_Bridge_2.2.1.9.zip --candidate approved-new --output dist/OpenOMSI_BCS_Bridge_2.2.1.9.zip
    - name: Replace the GitHub download and publish the small repair
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/publish_2219_release_repair.py --candidate approved-new --dist dist
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: Bridge-2.2.1.9-hotfix3-publication-evidence
        path: 'build-support/bridge2219-hotfix3/publication.json

          build-support/bridge2219-hotfix3/stable.json

          approved-new/build-report.json

          dist/publication-evidence.json

          dist/RELEASE-NOTES-HOTFIX3.md

          '
        retention-days: 30
        if-no-files-found: warn
'on':
  push:
    branches:
    - fix/distribution-configuration
    paths:
    - build-support/bridge2219-hotfix3/stable.json
    - .github/workflows/publish-2219-update-repair.yml
  workflow_dispatch: {}
