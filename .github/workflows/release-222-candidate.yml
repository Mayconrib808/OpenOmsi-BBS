name: Build complete Bridge 2.2.2 candidate (not published)
on:
  push:
    branches: [release/2.2.2-hotfix.2-cumulative-notes]
    paths:
      - .github/workflows/release-222-candidate.yml
      - scripts/build_222.py
      - source/setup_changelog_windows.go
      - source/setup_gui_windows.go
      - docs/releases/2.2.2.md
      - build-support/release222/native-build.json
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download approved Hotfix 3 complete baseline
        uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix3-candidate
          run-id: 40901236438
          github-token: ${{ github.token }}
          path: baseline
      - name: Download unchanged Hotfix 2 Coop archive chunks still used by Hotfix 3
        uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix2-candidate
          run-id: 40765546864
          github-token: ${{ github.token }}
          path: parts
      - name: Wait for exact tested fiscal-patrol native client and server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i = 0; $i -lt 300; $i++) {
            $native = gh api repos/Mayconrib808/OpenOmsi-BBS/actions/runs/41157142308 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect fixed native build' }
            if ($native.head_sha -ne '64db8910d135d123162ed90d772b06831909c9e2') { throw 'Wrong fiscal patrol source commit' }
            if ($native.status -eq 'completed') {
              if ($native.conclusion -ne 'success') { throw 'Fiscal patrol native tests did not pass' }
              break
            }
            if ($i -eq 299) { throw 'Native build is not complete' }
            Start-Sleep -Seconds 20
          }
      - name: Download tested native 0.3.46 client and server
        uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2-native-Windows
          run-id: 41157142308
          github-token: ${{ github.token }}
          path: native
      - name: Verify full baseline, preserve hosts and build cumulative 2.2.2
        shell: pwsh
        run: |
          python scripts/build_222.py --baseline baseline --parts parts --native native --output build/release222
          if ($LASTEXITCODE -ne 0) { throw 'Cumulative 2.2.2 packaging or regression checks failed' }
      - name: Publish candidate artifact to GitHub Actions only (no live update)
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2-Hotfix2-CANDIDATE
          path: |
            build/release222/Atualizar-Bridge.exe
            build/release222/build-report.json
            build/release222/coop-spec.json
            build/release222/coop_bundle_manifest.go
            build/release222/coop-assets/*
            build/release222/native-help.txt
            build/release222/setup-previews/*
          if-no-files-found: error
          retention-days: 30
