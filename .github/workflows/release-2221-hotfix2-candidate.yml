name: Build Bridge 2.2.2.1 Hotfix 2 cumulatively with native LAN pose and new desktop lobby
on:
  push:
    branches: [release/2.2.2.1-hotfix.2]
    paths:
      - .github/workflows/release-2221-hotfix2-candidate.yml
      - scripts/build_2221_hotfix2.py
      - source/version.go
      - docs/releases/2.2.2.1-hotfix.2.md
      - build-support/release2221-hotfix2/native-build.json
      - build-support/release2221-hotfix2/launcher-build.json
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: release-2221-hotfix2-candidate
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6a0319374e28ac91fa5b32773f4b11129ca39d20
          path: native-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact native branch CI and staging artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r=gh api repos/$env:GITHUB_REPOSITORY/actions/runs/41251297863 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect pinned native source CI' }
          for ($i=0; $i -lt 280 -and $r.status -ne 'completed'; $i++) {
            Start-Sleep -Seconds 15
            $r=gh api repos/$env:GITHUB_REPOSITORY/actions/runs/41251297863 | ConvertFrom-Json
          }
          if ($r.status -ne 'completed' -or $r.conclusion -ne 'success' -or $r.head_sha -ne '6a0319374e28ac91fa5b32773f4b11129ca39d20' -or $r.path -ne '.github/workflows/stage-2221-hotfix2-native.yml') { throw 'Unapproved or incomplete native candidate' }
          $head=(git -C native-source rev-parse HEAD).Trim()
          if ($head -ne $r.head_sha) { throw 'Native source archive mismatch' }
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.1-hotfix2-native-windows-candidate
          run-id: 41251297863
          github-token: ${{ github.token }}
          path: tested-native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.1-hotfix1-desktop-launcher-CANDIDATE
          run-id: 41233812376
          github-token: ${{ github.token }}
          path: tested-launcher
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2-native-Windows
          run-id: 41157142308
          github-token: ${{ github.token }}
          path: prior-native
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix3-candidate
          run-id: 40901236438
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.1.9-hotfix2-candidate
          run-id: 40765546864
          github-token: ${{ github.token }}
          path: parts
      - name: Unpack tested Windows lobby with all optional toggles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='tested-launcher/OpenOMSI-2.2.2.1-hotfix1-launcher-candidate.zip'
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()
          if ($digest -ne $expected) { throw 'Launcher ZIP integrity mismatch' }
          New-Item -ItemType Directory -Force launcher | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath launcher -Force
          $meta=Get-Content launcher/BUILD-INFO.json -Raw | ConvertFrom-Json
          if ($meta.version -ne '0.3.46-coop.15-2.2.2.1-hotfix.1' -or $meta.source_commit -ne '2063fd3c4b96db496102e8df6101e97a127b38bd' -or $meta.optional_ui_controls -ne 14) { throw 'Incorrect launcher build or feature switches' }
          if ((Get-FileHash launcher/openomsi-launcher-app.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.launcher_sha256) { throw 'Launcher binary mismatch' }
      - name: Unpack exact native executable and verify provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip='tested-native/OpenOMSI-2.2.2.1-hotfix2-native-windows-candidate.zip'
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expect=(Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()
          if ($digest -ne $expect) { throw 'Native ZIP checksum mismatch' }
          New-Item -ItemType Directory -Force native | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath native -Force
          $details=Get-Content native/BUILD-INFO.json -Raw | ConvertFrom-Json
          if ($details.source_commit -ne '6a0319374e28ac91fa5b32773f4b11129ca39d20' -or $details.bridge_release_target -ne '2.2.2.1-hotfix.2') { throw 'Wrong candidate source or version' }
          $nativeDigest=(Get-FileHash native/openomsi.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nativeDigest -ne $details.exe_sha256) { throw 'Native executable checksum mismatch' }
          if (-not (Test-Path native/bcs-assets/Vehicles/OpenOMSI_BCS/Fire/model/Fire.obj)) { throw '3D fire vehicle missing from native build' }
          if (-not (Test-Path native/bcs-assets/Vehicles/OpenOMSI_BCS/Police/model/Police.obj)) { throw '3D police vehicle missing from native build' }
          Get-ChildItem prior-native -Filter '*.dll' | Copy-Item -Destination native
          git -C native-source archive --format=tar.gz --prefix=openomsi-2221/ -o ../native/openomsi-source.tar.gz HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to archive native source' }
          & ./native/openomsi.exe --version | Out-File native/version.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Native CLI failed' }
          @'
          import json,hashlib
          from pathlib import Path
          d=Path("native")
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          commit="6a0319374e28ac91fa5b32773f4b11129ca39d20"
          version="0.3.46-coop.15-2.2.2.1-hotfix.2"
          assert version in (d/"version.txt").read_text(encoding="utf-8-sig")
          info=dict(commit=commit,build_commit=commit,run_id=41251297863,
              upstream_commit="17be22987d7c01c813a1473e7696fc71fb3b1d89",
              version=version,native_sha256=sha(d/"openomsi.exe"),
              source_sha256=sha(d/"openomsi-source.tar.gz"),
              windows_gameplay_tested=False)
          (d/"SOURCE.json").write_text(json.dumps(info,indent=2)+"\n")
          print("Verified source and native binary SHA:",info["native_sha256"])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native provenance invalid' }
      - name: Confirm signed-manifest release inputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content native/SOURCE.json -Raw | ConvertFrom-Json
          if ($meta.version -ne '0.3.46-coop.15-2.2.2.1-hotfix.2' -or $meta.run_id -ne 41251297863) { throw 'Mismatched P15 client/server candidate' }
          node --test native-source/launcher/tests/optional-features.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'New settings not represented in source UI' }
      - name: Build cumulative Bridge, Setup, client and P15 server
        shell: pwsh
        run: |
          python scripts/build_2221_hotfix2.py --baseline baseline --parts parts --native native --launcher launcher --output build/release2221hf2
          if ($LASTEXITCODE -ne 0) { throw 'Bridge 2.2.2.1 Hotfix2 packaging/regression failed' }
      - name: Verify release and trust boundaries
        shell: pwsh
        run: |
          @'
          import json,hashlib
          from pathlib import Path
          p=Path("build/release2221hf2")
          r=json.loads((p/"build-report.json").read_text())
          s=json.loads((p/"coop-spec.json").read_text())
          exe=(p/"Atualizar-Bridge.exe").read_bytes()
          assert r["version"]=="2.2.2.1-hotfix.2" and r["sequence"]==2026103104
          assert r["native_candidate_run"]==41251297863
          assert r["native_build_commit"]=="6a0319374e28ac91fa5b32773f4b11129ca39d20"
          assert r["desktop_launcher_unchanged"] is True
          assert r["desktop_launcher_commit"]=="2063fd3c4b96db496102e8df6101e97a127b38bd"
          assert r["desktop_launcher_run"]==41233812376
          path='OpenOmsi Coop 0.3.41/programa/openomsi-launcher-app.exe'
          assert s['files'][path]==r['desktop_launcher_sha256']
          assert s['files']['OpenOmsi Coop 0.3.41/programa/openomsi.exe']==s['files']['app/server-dinamico-p15/openomsi.exe']
          assert r['setup_changelog_ui_tested'] and r['bridge_regressions_tested']
          assert r["complete_hosts_unchanged"] and r["p14_server_unchanged"]
          assert r["bridge_regressions_tested"] and r["setup_changelog_ui_tested"]
          assert r["updater_sha256"]==hashlib.sha256(exe).hexdigest()
          assert r["coop_archive_sha256"]==s["sha256"]
          assert all((p/"coop-assets"/(t["sha256"]+".bin")).is_file() for t in s["parts"])
          print("Unsigned but verified 2.2.2.1 publish candidate:",r["updater_sha256"],r["installer_size"])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release inventory invalid' }
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2.1-Hotfix2-CANDIDATE
          path: |
            build/release2221hf2/Atualizar-Bridge.exe
            build/release2221hf2/build-report.json
            build/release2221hf2/coop-spec.json
            build/release2221hf2/coop_bundle_manifest.go
            build/release2221hf2/coop-assets/*
            build/release2221hf2/native-help.txt
            build/release2221hf2/setup-previews/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2.1-Hotfix2-SIGNING-METADATA
          path: |
            build/release2221hf2/build-report.json
            build/release2221hf2/coop-spec.json
          if-no-files-found: error
          retention-days: 30
