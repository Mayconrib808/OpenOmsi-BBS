name: Build update candidate
on:
  push:
    branches: ['release/2.1.0']
    paths: ['.github/workflows/update-candidate.yml', 'scripts/build_update_components.py', 'scripts/build_bridge_update.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-update-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify live distribution and build update binaries only
        shell: bash
        run: |
          node -e 'fetch("https://openomsi-bbs-updates.maycongamesmaximo.workers.dev/health").then(async r=>{const s=await r.text();console.log("Distribution health:",r.status,s);if(!r.ok||JSON.parse(s).service!=="openomsi-bbs-updates")process.exitCode=1})'
          GOARCH=386 CGO_ENABLED=0 go test -v source/update_process_windows.go source/update_process_windows_test.go
          python - <<'PY'
          import sys, subprocess
          sys.path.insert(0,'scripts'); import build
          files=[*build.TEST_COMMON,'process_windows.go','company_host_process_windows.go','openomsi_probe_windows.go',*build.TEST_FILES,'company_host_process_windows_test.go']
          subprocess.run(['go','test','-v','-run','TestPackageDocumentation|TestPackageVerification',*files],cwd='source',check=True)
          PY
          python scripts/build_update_components.py --output build/update-components --update-origin https://openomsi-bbs-updates.maycongamesmaximo.workers.dev --update-sequence 2026101105
          python scripts/build_bridge_update.py --package build/update-components --output build/update-candidate/OpenOmsi_BBS_Atualizacao.zip --components build/update-candidate/components
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bridge-update-candidate
          path: build/update-candidate/Atualizar-Bridge.exe
          if-no-files-found: error
          retention-days: 14
