name: Stage OpenOMSI 2.2.2.2 native game, server, real winter clothes and feature evidence
on:
  push:
    branches: [feat/winter-artist-assets]
    paths: [.github/workflows/stage-2222-native.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-2222-native
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      OPENOMSI_VERSION: 0.3.46-coop.15-2.2.2.2
      OPENOMSI_COOP_GAME_ONLY: '1'
      TAURI_CONFIG: '{"version":"0.3.46"}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: 2222-native-stage
      - name: Test real passenger clothing parser and event diagnostics
        shell: pwsh
        run: |
          cargo test --locked -p omsi-sim feature_audit -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Feature-audit counters regression' }
          cargo test --locked -p omsi-app winter::tests::accessory_selection_changes_with_temperature
          if ($LASTEXITCODE -ne 0) { throw 'Winter threshold regression' }
          cargo test --locked -p omsi-sim people::clothing::tests
          if ($LASTEXITCODE -ne 0) { throw 'Existing CTI regression' }
          node --test launcher/tests/optional-features.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Settings regression' }
      - name: Download real artist garments and validate Windows native garment parser
        uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-Bridge-WinterClothes-REAL-ARTIST-MODELS-TEST-ONLY
          run-id: 41257972400
          github-token: ${{ github.token }}
          path: staged-winter
      - name: Verify all seven originals, their attribution and game loader
        shell: pwsh
        env:
          OPENOMSI_WINTER_TEST_ASSETS: ${{ github.workspace }}/staged-winter
        run: |
          $meta=Get-Content staged-winter/winter-candidate-manifest.json -Raw | ConvertFrom-Json
          if ($meta.garments.Count -ne 7 -or $meta.release_approved -or $meta.gameplay_visual_tested) { throw 'Invalid artistic asset provenance' }
          cargo test --locked -p omsi-app authored_bundle_is_readable_by_the_real_game_loader -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Real winter assets not loadable by game' }
      - name: Build emergency vehicles, preserve originals and include winter overlay
        shell: pwsh
        run: |
          python scripts/build_bcs_real_vehicles.py --root "$PWD/staging/bcs-assets"
          if ($LASTEXITCODE -ne 0) { throw 'Emergency assets failed' }
          Copy-Item staged-winter/bcs-assets/WinterClothes staging/bcs-assets/WinterClothes -Recurse
          if (-not (Test-Path staging/bcs-assets/WinterClothes/toigo_gloves_short/garment.obj)) { throw 'Original winter geometry missing' }
          if (-not (Test-Path staging/bcs-assets/WinterClothes/AUTHORS_AND_LICENSES.txt)) { throw 'Author attribution missing' }
          $env:BCS_TEST_ASSETS=(Resolve-Path staging/bcs-assets).Path
          cargo test --locked -p omsi-app bcs_fallback_real_assets_load -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Previous emergency vehicles regressed' }
      - name: Compile Windows native game and P15 server
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-app
          if ($LASTEXITCODE -ne 0) { throw 'Windows native compile failed' }
          & ./target/release/openomsi.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows native smoke test failed' }
      - name: Pack exact signed-release candidate inputs with SHA256 provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item target/release/openomsi.exe staging/openomsi.exe
          $exeHash=(Get-FileHash staging/openomsi.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $meta=[ordered]@{
            bridge_release_target='2.2.2.2'
            native_version=$env:OPENOMSI_VERSION
            source_commit='${{ github.sha }}'
            exe_sha256=$exeHash
            winter_source_run_id=41257972400
            native_audit_included=$true
            gameplay_visual_tested=$false
            status='NOT_PUBLISHED'
          }
          $meta|ConvertTo-Json|Set-Content -Encoding utf8 staging/BUILD-INFO.json
          Compress-Archive -Path staging/openomsi.exe,staging/BUILD-INFO.json,staging/bcs-assets -DestinationPath OpenOMSI-2.2.2.2-native-windows-candidate.zip -CompressionLevel Optimal
          $zipSha=(Get-FileHash OpenOMSI-2.2.2.2-native-windows-candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii OpenOMSI-2.2.2.2-native-windows-candidate.zip.sha256 "$zipSha  OpenOMSI-2.2.2.2-native-windows-candidate.zip"
          Write-Host "NATIVE 2.2.2.2 SHA256 $exeHash"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOMSI-2.2.2.2-native-windows-CANDIDATE
          path: |
            OpenOMSI-2.2.2.2-native-windows-candidate.zip
            OpenOMSI-2.2.2.2-native-windows-candidate.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
