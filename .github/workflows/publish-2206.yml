name: Publish signed Bridge 2.2.0.6.2 Coop12
on:
  push:
    branches: ['release/2.2.0.6-coop12-p15']
    paths: ['build-support/bridge2206/stable.json', 'build-support/bridge2206/publication.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact successful cumulative Windows candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process'),p=require('./build-support/bridge2206/publication.json');
          if(p.version!=='2.2.0.6.2'||p.sequence!==2026102408||!Number.isSafeInteger(p.candidate_run_id)||!/^[a-f0-9]{40}$/.test(p.candidate_commit))throw Error('Invalid release request');
          const r=JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${p.candidate_run_id}`],{encoding:'utf8'}));
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==p.candidate_commit||r.path!=='.github/workflows/release-2206.yml'||r.head_branch!=='release/2.2.0.6-coop12-p15')throw Error('Exact cumulative candidate did not pass');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${p.candidate_run_id}\n`);
          NODE
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.6-candidate
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: approved-new
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.6-evidence
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: approved-evidence
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.5-candidate
          run-id: 40056968283
          github-token: ${{ github.token }}
          path: approved-prior2205
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.4-candidate
          run-id: 40017148265
          github-token: ${{ github.token }}
          path: approved-prior2204
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.3-hotfix.2-candidate
          run-id: 39992267151
          github-token: ${{ github.token }}
          path: approved-hotfix
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.1-approved-publication
          run-id: 39795944956
          github-token: ${{ github.token }}
          path: approved-previous
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.2-update-candidate
          run-id: 39863166328
          github-token: ${{ github.token }}
          path: approved-previous2
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.3-update-candidate
          run-id: 39973561655
          github-token: ${{ github.token }}
          path: approved-base
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.6-candidate
          run-id: 40097453331
          github-token: ${{ github.token }}
          path: approved-prior2206
      - uses: actions/download-artifact@v8
        with:
          name: Bridge-2.2.0.6-candidate
          run-id: 40106329076
          github-token: ${{ github.token }}
          path: approved-prior22061
      - name: Verify signature, native evidence, pins and preserved P15 host
        run: node build-support/bridge2206/publication.mjs prepare
      - name: Distribution regression checks
        run: node --test update-service/worker*.test.mjs
      - name: Deploy signed updater and all immutable Coop and server downloads
        working-directory: distribution
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify live manifest and all previous and new downloads
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node build-support/bridge2206/publication.mjs verify-live; then exit 0; fi
            if test "$attempt" -lt 6; then sleep 5; fi
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: Bridge-2.2.0.6.2-live
          path: |
            build-support/bridge2206/publication.json
            build-support/bridge2206/stable.json
            approved-new/build-report.json
            approved-new/coop-spec.json
            approved-evidence/**
          retention-days: 30
          if-no-files-found: error
