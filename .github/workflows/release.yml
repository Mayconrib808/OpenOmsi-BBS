name: Publish tested release

on:
  workflow_run:
    workflows: [Source checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-tested-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify approved binaries and publish complete ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/tested-release
        run: >-
          python3 scripts/publish_release.py
          --run-id "$SOURCE_RUN_ID"
          --commit "$SOURCE_COMMIT"
          --artifact-dir "$RELEASE_ARTIFACT_DIR"
