name: Publish Bridge 2.1.9.3 automatic update

on:
  push:
    branches: ['release/2.1.9.3']
    paths: ['update-service/assets/stable.json', 'update-service/publication.json', '.github/workflows/publish-2193-cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish signed 2.1.9.3') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve exact validated candidate
        id: candidate
        run: |
          node - <<'NODE'
          const fs=require('fs'),p=require('./update-service/publication.json');
          if(!Number.isSafeInteger(p.candidate_run_id)||p.candidate_run_id<1||p.artifact_name!=='Bridge-2.1.9.3'||!/^[a-f0-9]{40}$/.test(p.candidate_commit)) throw Error('Invalid 2.1.9.3 candidate');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${p.candidate_run_id}\ncommit=${p.candidate_commit}\n`);
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Bridge-2.1.9.3
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: approved-update
      - name: Verify publisher signature and exact installer
        run: node update-service/publication.mjs prepare approved-update/build/update-2193/Atualizar-Bridge.exe
      - name: Distribution regression checks
        run: node --test update-service/worker*.test.mjs
      - name: Publish reviewed versioned files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          if gh release view v2.1.9.3 >/dev/null 2>&1; then
            gh release download v2.1.9.3 --pattern Atualizar-Bridge.exe --dir existing-release
            cmp approved-update/build/update-2193/Atualizar-Bridge.exe existing-release/Atualizar-Bridge.exe
            exit 0
          fi
          gh release create v2.1.9.3 \
            approved-update/dist/*.zip approved-update/dist/*.zip.sha256 \
            approved-update/build/update-2193/Atualizar-Bridge.exe \
            approved-update/build/update-2193/OpenOmsi_BBS_2.1.9.3_Atualizacao.zip \
            approved-update/build/update-2193/RELEASE-HASHES.txt \
            --target "$CANDIDATE_COMMIT" --latest=false \
            --title 'OpenOMSI + BBS 2.1.9.3' --notes-file docs/releases/v2.1.9.3.md
      - name: Deploy existing 2.1 distribution
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify published signature and installer bytes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node update-service/publication.mjs verify-live; then exit 0; fi
            if test "$attempt" -lt 6; then sleep 5; fi
          done
          exit 1
