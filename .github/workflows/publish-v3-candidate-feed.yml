name: Publish 3.0.4 candidate feed
on:
  push:
    branches: [updates/3.0.4-candidate]
    paths: [cloudflare-updates-v3/preview-v2.json, .github/workflows/publish-v3-candidate-feed.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-updates-v3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact published artifacts and verify every hash
        run: python3 cloudflare-updates-v3/stage-published.py
      - name: Deploy only the independent 3.x update worker
        working-directory: cloudflare-updates-v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify live metadata and immutable publisher record
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,pathlib
          origin='https://openomsi-bbs-updates-v3.maycongamesmaximo.workers.dev'
          headers={'User-Agent':'BBS-OpenOmsi-Multiplayer/3.0.4'}
          request=urllib.request.Request(origin+'/preview-v2.json',headers=headers)
          with urllib.request.urlopen(request,timeout=30) as response: current=json.load(response)
          assert current==json.loads(pathlib.Path('cloudflare-updates-v3/preview-v2.json').read_text())
          release=json.loads(base64.b64decode(current['payload']))
          assert release['version']=='3.0.4' and release['sequence']==2026101404

          request=urllib.request.Request(origin+'/preview.json',headers=headers)
          with urllib.request.urlopen(request,timeout=30) as response: legacy=json.load(response)
          assert legacy==json.loads(pathlib.Path('cloudflare-updates-v3/preview.json').read_text())
          old=json.loads(base64.b64decode(legacy['payload']))
          assert old['version']=='3.0.3' and old['sequence']==2026101403
          print('Live 3.x feed serves anchored 3.0.4 metadata; legacy signed 3.0.3 fallback remains intact')
          PY
