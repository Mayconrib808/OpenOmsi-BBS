name: Publish signed 3.0.3 candidate feed
on:
  push:
    branches: [updates/3.0.3-candidate]
    paths: [cloudflare-updates-v3/preview-v2.json, .github/workflows/publish-v3-candidate-feed.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-updates-v3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact published artifacts and verify every hash
        run: python3 cloudflare-updates-v3/stage-published.py
      - name: Deploy only the independent 3.x update worker
        working-directory: cloudflare-updates-v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify live metadata and immutable publisher record
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,pathlib
          origin='https://openomsi-bbs-updates-v3.maycongamesmaximo.workers.dev'
          headers={'User-Agent':'BBS-OpenOmsi-Multiplayer/3.0.3'}
          for name in ['preview.json','preview-v2.json']:
              request=urllib.request.Request(origin+'/'+name,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response: envelope=json.load(response)
              assert envelope==json.loads(pathlib.Path('cloudflare-updates-v3',name).read_text())
              release=json.loads(base64.b64decode(envelope['payload']))
              assert release['version']=='3.0.3' and release['sequence']==2026101403
          print('Live 3.x feed serves verified 3.0.3 metadata for both old and current preview clients')
          PY
