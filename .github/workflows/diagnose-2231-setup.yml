name: Diagnose 2.2.3.1 Setup activation failure from published package
on:
  push:
    branches: [fix/2231-setup-activation]
    paths: [.github/workflows/diagnose-2231-setup.yml]
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact verified 2.2.3.1 Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const cp=require('child_process');
          const api=p=>JSON.parse(cp.execFileSync('gh',['api',p],{encoding:'utf8'}));
          const r=api('repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/42116052029');
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!=='4a9f9c5bde053fcce92e100e65c544fb4163c9e7') throw Error('Not approved run');
          const a=api('repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/42116052029/artifacts').artifacts.find(x=>x.id===13457334107);
          if(!a||a.name!=='Bridge-2.2.3.1-FULL-CANDIDATE'||a.digest!=='sha256:cbd0f2221a780b09433c4621b8f8158d235ef8226f0493cfbe798775ecec51ba') throw Error('Not approved package');
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.3.1-FULL-CANDIDATE
          run-id: 42116052029
          github-token: ${{ github.token }}
          path: approved-new
      - name: Diagnose activation SHA and game binary
        run: python3 tools/diagnose-2231-activation.py
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.3.1-activation-diagnostics
          path: activation-diagnostics.json
          retention-days: 90
          if-no-files-found: error
