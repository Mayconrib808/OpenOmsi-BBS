name: Validate 2.2.2.1 traffic branch safely
on:
  push:
    branches: [feature/2221-bays-courtesy-double-parking]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: check-2221-traffic
  cancel-in-progress: false
jobs:
  windows-traffic:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      OPENOMSI_VERSION: 0.3.46-coop.15-2.2.2.1-dev
      OPENOMSI_COOP_GAME_ONLY: '1'
      TAURI_CONFIG: '{"version":"0.3.46"}'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: 2221-traffic
      - name: Unit tests for berth, courtesy, and double-parking safety
        shell: pwsh
        run: |
          cargo test --locked --release -p omsi-sim courtesy_tests
          if ($LASTEXITCODE -ne 0) { throw 'Courtesy tests failed' }
          cargo test --locked --release -p omsi-sim berths::tests
          if ($LASTEXITCODE -ne 0) { throw 'Berth tests failed' }
          cargo test --locked --release -p omsi-sim illegal_parking::tests
          if ($LASTEXITCODE -ne 0) { throw 'Double parking safety tests failed' }
          cargo test --locked --release -p omsi-cfg optional_features::tests
          if ($LASTEXITCODE -ne 0) { throw 'Optional toggles failed' }
      - name: Test launcher settings
        shell: pwsh
        run: |
          node --test launcher/tests/optional-features.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher test failed' }
      - name: Compile native Windows client and server mode
        shell: pwsh
        run: |
          cargo build --locked --release -p omsi-app
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          & .\target\release\openomsi.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Startup failed' }
