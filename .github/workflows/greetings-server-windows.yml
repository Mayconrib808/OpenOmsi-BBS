name: Dynamic server 0.3.39 streaming and greetings Windows
on:
  push:
    branches: ['release/2.2.0.3']
    paths: ['build-support/greetings-server/**', '.github/workflows/greetings-server-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      OPENOMSI_VERSION: 0.3.39-bbs-stream.2
      OPENOMSI_COOP_GAME_ONLY: '1'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          path: support
      - uses: actions/checkout@v7
        with:
          repository: openOMSI-org/openOMSI
          ref: 9eaf95d4caafabe041edcdfc37931b5259c30c8a
          path: game
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: coop9-server-windows-msvc
          cache-on-failure: true
          workspaces: |
            game -> target
            game/tools/coop-check -> target
      - name: Preserve exact 0.3.39 base and apply dynamic streaming and greetings
        run: python support/build-support/greetings-server/prepare.py
      - name: Actual AI greeting, input discrimination, cooldown, sound and lamp regressions
        working-directory: game
        shell: pwsh
        run: |
          cargo test --locked --release -p omsi-sim --lib ai_traffic::greetings 2>&1 | Tee-Object -FilePath ../out/greetings-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows game and streaming server runtime
        working-directory: game
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p omsi-app --bin openomsi 2>&1 | Tee-Object -FilePath ../out/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/x86_64-pc-windows-msvc/release/openomsi.exe ../out/openomsi.exe
      - name: Native Windows self-test and server capability
        working-directory: game
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/openomsi.exe'
          & $exe --version 2>&1 | Tee-Object -FilePath ../out/windows-version.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --help 2>&1 | Tee-Object -FilePath ../out/windows-help.log
          if ($LASTEXITCODE -ne 0 -or (Get-Content ../out/windows-help.log -Raw) -notmatch '--server') { throw 'Server capability missing' }
          & $exe --self-test 2>&1 | Tee-Object -FilePath ../out/windows-self-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{passed=$true; graphical_gameplay_tested=$false; two_player_gameplay_tested=$false; protocol=14; streaming_preserved=$true} | ConvertTo-Json | Set-Content ../out/windows-startup.json
      - name: Package complete corresponding dynamic server source
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from zipfile import ZipFile,ZIP_DEFLATED; import hashlib,json; root=Path('game'); z=ZipFile('out/openomsi-dynamic-source.zip','w',ZIP_DEFLATED,compresslevel=9); [z.write(p,Path('openomsi-dynamic-source')/p.relative_to(root)) for p in sorted(root.rglob('*')) if p.is_file() and not any(v in {'.git','target'} for v in p.relative_to(root).parts)]; z.close(); Path('out/build-sha256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('out').iterdir() if p.is_file() and p.suffix!='.log'},indent=2))"
      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status=Get-MpComputerStatus
          if (-not $status.AntivirusEnabled) { throw 'Defender unavailable' }
          $platform=Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $scanner=if ($platform) {$platform.FullName} else {"$env:ProgramFiles/Windows Defender/MpCmdRun.exe"}
          & $scanner -SignatureUpdate 2>&1 | Out-File out/defender-update.log
          & $scanner -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE/out" -DisableRemediation 2>&1 | Tee-Object -FilePath out/defender-scan.log
          $code=$LASTEXITCODE
          $passed=$code -eq 0 -and (Get-Content out/defender-scan.log -Raw) -match 'found no threats|no threats found'
          @{status=$(if($passed){'passed'}else{'requires_review'});exit_code=$code;engine=$status.AMEngineVersion;signatures=$status.AntivirusSignatureVersion} | ConvertTo-Json | Set-Content out/defender-report.json
          if (-not $passed) { throw 'Defender scan did not pass' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bridge-2203-dynamic-windows
          retention-days: 30
          if-no-files-found: error
          path: out/*
