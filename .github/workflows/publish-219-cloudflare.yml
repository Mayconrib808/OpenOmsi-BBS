name: Publish 2.1.9 automatic update to Cloudflare
# recovery-first revision 2026101404

on:
  push:
    branches: ['release/2.1.9-bcs-5.0.2.0']
    paths: ['.github/workflows/publish-219-cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Read approved 2.1.9 candidate reference
        id: publication
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=require('./update-service/publication.json');
          if(!Number.isSafeInteger(p.candidate_run_id)||p.candidate_run_id<1) throw Error('Invalid candidate run');
          if(p.artifact_name!=='Bridge-2.1.9-integrity-repair') throw Error('Unexpected artifact name');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${p.candidate_run_id}\nartifact_name=${p.artifact_name}\n`);
          NODE

      - name: Download exact corrected 2.1.9 updater
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.publication.outputs.artifact_name }}
          run-id: ${{ steps.publication.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/approved-update

      - name: Verify original-key signed 2.1.9 manifest and updater
        run: node update-service/publication.mjs prepare "${{ runner.temp }}/approved-update/Atualizar-Bridge.exe"

      - name: Test distribution routes
        run: node --test update-service/worker*.test.mjs

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Publish corrected 2.1.9 automatic update to Cloudflare
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc

      - name: Verify live signature and corrected 2.1.9 installer integrity
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node update-service/publication.mjs verify-live; then exit 0; fi
            if test "$attempt" -lt 6; then sleep 5; fi
          done
          exit 1
