name: Build and validate Bridge 2.1.9.3

on:
  push:
    branches: ['release/2.1.9.3']
    paths: ['source/**', 'scripts/**', 'docs/releases/v2.1.9.3.md', '.github/workflows/release-2193.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-2193
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Lua next-trip and destination regressions
        run: |
          python -m pip install lupa==2.8
          python scripts/test_live_trip_plugin.py
      - name: Directory and update distribution regressions
        run: |
          node --test relay/test/room.test.js
          node --test update-service/worker*.test.mjs
      - name: Portable tests, vet and Windows cross-builds
        if: runner.os == 'Linux'
        run: python scripts/build.py --check-only
      - name: Reuse unchanged tested native server
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: BBS-free-bus-native-server
          path: build/native-server
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Mayconrib808/OpenOmsi-BBS
          run-id: '38644903247'
      - name: Windows tests, GUI, helper DLL and complete package
        if: runner.os == 'Windows'
        run: >-
          python scripts/build.py --native-server build/native-server
          --update-origin https://openomsi-bbs-updates.maycongamesmaximo.workers.dev
          --update-sequence 2026101503
      - name: Build cumulative recovery updater
        if: runner.os == 'Windows'
        run: >-
          python scripts/build_bridge_update.py
          --package dist/OpenOmsi.+.BBS.2.1.9.3
          --output build/update-2193/OpenOmsi_BBS_2.1.9.3_Atualizacao.zip
          --components build/update-2193/components
      - name: Defender scan
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/scan_release_package.ps1 -PackagePath 'dist/OpenOmsi.+.BBS.2.1.9.3.zip'
      - name: Inspect Defender evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path=Join-Path '${{ runner.temp }}' 'openomsi-defender-report/report.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Missing Defender evidence' }
          $r=Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($r.status -eq 'clean_in_this_environment_not_a_microsoft_false_positive_ruling') { exit 0 }
          $limitations=@('Microsoft Defender scanner is unavailable.','Defender real-time/download/cloud protection is unavailable; no clean result can be claimed.','Defender cloud validation failed; publication is blocked.','The remote procedure call failed.')
          if ($r.status -eq 'inconclusive' -and $limitations -contains [string]$r.error) {
            Write-Warning ('Hosted runner scan inconclusive; no clean verdict is claimed: '+[string]$r.error)
            exit 0
          }
          throw ('Defender scan rejected the package: '+[string]$r.status+' '+[string]$r.error)
      - name: Upload scan evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Defender-2.1.9.3
          path: ${{ runner.temp }}/openomsi-defender-report/*
          if-no-files-found: ignore
      - name: Record updater hash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p='build/update-2193/Atualizar-Bridge.exe'
          $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
          $s=(Get-Item -LiteralPath $p).Length
          "Updater SHA-256: $h" | Set-Content build/update-2193/RELEASE-HASHES.txt
          "Updater size: $s" | Add-Content build/update-2193/RELEASE-HASHES.txt
          if ($s -gt 25*1024*1024) { throw 'Installer exceeds existing distribution asset limit' }
      - name: Upload release and signed-update candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bridge-2.1.9.3
          path: |
            build/setup-previews/*.png
            dist/*.zip
            dist/*.zip.sha256
            build/update-2193/Atualizar-Bridge.exe
            build/update-2193/OpenOmsi_BBS_2.1.9.3_Atualizacao.zip
            build/update-2193/RELEASE-HASHES.txt
          if-no-files-found: error
          retention-days: 30
