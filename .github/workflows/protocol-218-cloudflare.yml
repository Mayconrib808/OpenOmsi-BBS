name: Validate and publish manual 2.1.8 update
on:
  push:
    branches: ['hotfix/2.1.8-protocol7']
    paths: ['hotfix218/**', '.github/workflows/protocol-218-cloudflare.yml']
permissions:
  contents: read
concurrency:
  group: openomsi-update-distribution
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.23.2'
          cache: false
      - name: Protocol and BBS integration regressions
        shell: bash
        run: |
          python - <<'PY'
          import sys, subprocess, os
          sys.path.insert(0,'scripts'); import build
          files=[*build.TEST_COMMON,'process_windows.go','company_host_process_windows.go','openomsi_probe_windows.go',*build.TEST_FILES,'company_host_process_windows_test.go']
          subprocess.run(['go','test','-count=1','-run','TestCompany|TestLiveTripGateway|TestPeDePeFuel|TestPeDePeFreshSituation|TestOpenOMSI|TestHostAgent',*files],cwd='source',env=dict(os.environ,GO111MODULE='off',CGO_ENABLED='0'),check=True)
          PY
      - name: Official 0.2.48 runtime and authenticated reconnect
        shell: bash
        run: python scripts/test_company_gateway_runtime.py --version 0.2.48
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve existing signed stable channel and prepare manual update
        run: |
          python3 hotfix217/reconstruct.py
          node update-service/publication.mjs prepare hotfix217/Atualizar-Bridge.exe
          python3 hotfix218/reconstruct.py
          node --test update-service/worker*.test.mjs
      - name: Publish immutable manual download
        working-directory: update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.jsonc
      - name: Verify manual download and preserved signed manifest
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node hotfix218/verify-live.mjs && node update-service/publication.mjs verify-live; then exit 0; fi
            if test "$attempt" -lt 6; then sleep 5; fi
          done
          exit 1
