name: Full HF5 verified native boarding + HostAgent + international BCS
on:
  push:
    branches: [release-candidate/2224-hotfix5-verified-native]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: full-hf5-verified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combined:
    name: Verify native provenance and rebuild Windows cumulative updater
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      OPENOMSI_VERSION: 0.3.47-coop.16-2.2.2.4
      OPENOMSI_COOP_GAME_ONLY: '1'
      OMSI_NO_UPDATE: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Mayconrib808/OpenOmsi-BBS
          ref: 201d37c162a35b0954b4d3f791931e2c532f5fba
          path: native-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.2
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify localized BCS and HostAgent Go regressions
        shell: pwsh
        run: |
          python scripts/build_2203.py --tests-only
          if ($LASTEXITCODE -ne 0) { throw 'Bridge Go tests failed' }
      - name: Verify exact passing Windows native regression artifact (not a new untested exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41861885139" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -ne '201d37c162a35b0954b4d3f791931e2c532f5fba' -or $run.path -ne '.github/workflows/p16-boarding-offset-gate.yml') { throw 'Unapproved native regression build run' }
          $arts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/41861885139/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify native artifact in GitHub API' }
          $artifact = $arts.artifacts | Where-Object { $_.name -eq 'OpenOMSI-P16-boarding-offset-gate-CANDIDATE' } | Select-Object -First 1
          if (!$artifact -or $artifact.id -ne 13342486464 -or $artifact.digest -ne 'sha256:60f0c2864913622747dd1ad9e94abed582c0643b181c218cf0e12256de32dc14' -or $artifact.expired) { throw 'Native test artifact mismatch' }
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-P16-boarding-offset-gate-CANDIDATE
          run-id: 41861885139
          github-token: ${{ github.token }}
          path: verified-native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.4-HF2-native-CANDIDATE
          run-id: 41539618533
          github-token: ${{ github.token }}
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2.4-HF2-launcher-CANDIDATE
          run-id: 41539618533
          github-token: ${{ github.token }}
          path: launcher
      - uses: actions/download-artifact@v4
        with:
          name: OpenOMSI-2.2.2-native-Windows
          run-id: 41157142308
          github-token: ${{ github.token }}
          path: prior-native
      - uses: actions/download-artifact@v4
        with:
          name: Bridge-2.2.2.3-Final-CANDIDATE
          run-id: 41439660434
          github-token: ${{ github.token }}
          path: baseline
      - name: Replace old native with hash-pinned tested Windows binary and archive exact source
        shell: pwsh
        run: |
          # A standalone openOMSI.exe needs the app-local Steam/C++ DLLs
          # even for --version. Previously 0xc0000135 blocked publication here.
          Get-ChildItem prior-native -Filter '*.dll' | Copy-Item -Destination native
          @'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          native=Path('native'); source=Path('native-source')
          expected='201d37c162a35b0954b4d3f791931e2c532f5fba'
          rev=subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()
          assert rev==expected, 'Native checked-out source does not match the tested passenger patch'
          old_sha=hashlib.sha256((native/'openomsi.exe').read_bytes()).hexdigest()
          shutil.copyfile(Path('verified-native/openomsi.exe'),native/'openomsi.exe')
          new_sha=hashlib.sha256((native/'openomsi.exe').read_bytes()).hexdigest()
          assert old_sha!=new_sha and new_sha=='577fefbd10a64cf17a049644bac6331575cbd573583ea0a9d53ebbfc8827a4e3', 'UNVERIFIED OR OLD NATIVE EXECUTABLE'
          subprocess.run(['git','-C',str(source),'archive','--format=tar.gz','--prefix=openomsi-passengers/','-o','../native/openomsi-source.tar.gz','HEAD'],check=True)
          actual=subprocess.run([str((native/'openomsi.exe').resolve()),'--version'],capture_output=True,text=True)
          print('Native version:',actual.returncode,actual.stdout,actual.stderr)
          version='0.3.47-coop.16-2.2.2.4'
          assert actual.returncode==0 and version in (actual.stdout+actual.stderr), 'Native version does not match P16'
          (native/'version.txt').write_text(actual.stdout+actual.stderr,encoding='utf8')
          digest=lambda name:hashlib.sha256((native/name).read_bytes()).hexdigest()
          info=dict(commit=rev,build_commit=rev,run_id=int(os.environ['GITHUB_RUN_ID']),
            upstream_commit='8c4a0d3fd4439e49d18c2812bbd4d91cdd0af7f6',
            version=version,native_sha256=new_sha,source_sha256=digest('openomsi-source.tar.gz'),
            verified_binary_run_id=41861885139,verified_binary_artifact_id=13342486464,
            verified_binary_artifact_digest='sha256:60f0c2864913622747dd1ad9e94abed582c0643b181c218cf0e12256de32dc14',verified_binary_sha256=new_sha,
            winter_clothing_removed=True,passenger_upstream_tag='v0.3.47',
            passenger_upstream_commit='8c4a0d3fd4439e49d18c2812bbd4d91cdd0af7f6',
            windows_gameplay_tested=False,paired_gameplay_tested=False,gameplay_visual_tested=False)
          for name in ('SOURCE.json','BUILD-INFO.json'):
            (native/name).write_text(json.dumps(info,indent=2)+'\n',encoding='utf8')
          assert (native/'bcs-assets/PassengerVoices/pt-BR').is_dir(), 'Eight recordings are missing'
          assert len(list((native/'bcs-assets/PassengerVoices/pt-BR').glob('*.wav')))==8
          assert not (native/'bcs-assets/WinterClothes').exists()
          print('HF5 VERIFIED NATIVE REPLACED',old_sha,'->',new_sha)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'New native source/build provenance invalid' }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenOMSI-HF5-verified-native-and-source-CANDIDATE
          path: native/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Build new cumulative HF5 with all fixes and GUI update smoke tests
        shell: pwsh
        run: |
          Get-ChildItem prior-native -Filter '*.dll' | Copy-Item -Destination native
          python scripts/build_2224.py --baseline baseline --parts baseline --native native --launcher launcher --output build/release2224
          if ($LASTEXITCODE -ne 0) { throw 'Full HF5 install / HostAgent / changelog test failed' }
          @'
          import json, os, hashlib
          from pathlib import Path
          p=Path('build/release2224')
          r=json.loads((p/'build-report.json').read_text())
          i=json.loads((p/'one-click-install-test.json').read_text())
          u=json.loads((p/'native-p16-controls.json').read_text())
          assert r['version']=='2.2.2.4-hotfix.5' and r['sequence']==2026110402
          assert r['native_build_commit']=='201d37c162a35b0954b4d3f791931e2c532f5fba'
          assert r['native_candidate_run']==int(os.environ['GITHUB_RUN_ID'])
          assert r['native_verified_binary_run']==41861885139 and r['native_verified_binary_artifact_id']==13342486464
          assert r['native_verified_binary_sha256']=='577fefbd10a64cf17a049644bac6331575cbd573583ea0a9d53ebbfc8827a4e3'
          assert r['native_client_sha256']['openomsi.exe']==r['dynamic_p16_sha256']
          assert r['host_preferences_limit']==32<<20 and r['large_host_inventory_ui_tested']
          assert u['large_inventory_tested'] and u['inventory_files']==22000
          assert i['status']=='passed' and i['invocations']==1 and i['setup_reopened']
          assert not r['windows_gameplay_tested'] and not r['paired_gameplay_tested']
          print('HF4 FULL WINDOWS CANDIDATE PASSED, NOT YET SIGNED OR DEPLOYED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Full artifact validation failed' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: HF4-full-failure-diagnostics
          path: |
            build/release2224/one-click-install-setup.log
            build/release2224/runtime/app/setup-v1.1.3.log
            build/release2224/setup-previews/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2.4-hotfix.5-FULL-CANDIDATE
          path: |
            build/release2224/Atualizar-Bridge.exe
            build/release2224/build-report.json
            build/release2224/coop-spec.json
            build/release2224/coop_bundle_manifest.go
            build/release2224/coop-assets/*
            build/release2224/native-help.txt
            build/release2224/native-p16-controls.json
            build/release2224/one-click-install-test.json
            build/release2224/one-click-install-setup.log
            build/release2224/setup-previews/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
