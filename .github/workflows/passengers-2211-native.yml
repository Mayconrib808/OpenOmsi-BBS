    - name: Reconcile only required cumulative dependency edges in launcher lock
      shell: pwsh
      working-directory: game
      run: "@'\nfrom pathlib import Path\nimport tomllib,subprocess\np=Path('launcher/src-tauri/Cargo.lock')\nbefore=tomllib.loads(p.read_text())['package']\nsubprocess.run(['cargo','metadata','--format-version','1','--manifest-path','launcher/src-tauri/Cargo.toml'],stdout=subprocess.DEVNULL,check=True)\nafter=tomllib.loads(p.read_text())['package']\ndef identities(packages):\n d={}\n for x in packages:\n  if 'source' in x:d.setdefault(x['name'],set()).add((x['version'],x['source']))\n return d\nold,new=identities(before),identities(after)\nchanges=[name for name in old.keys() & new.keys() if old[name]-new[name] and new[name]-old[name]]\nassert not changes,('Existing dependency pins unexpectedly changed',changes)\nprint('Launcher lock reconciled without replacing existing registry/git dependency pins.')\n'@ | python -\nif ($LASTEXITCODE -ne 0) { throw 'Beta build preparation failed' }"
    - name: Compile desktop lobby with embedded Beta2 settings
      shell: pwsh
      working-directory: game
      run: 'cargo build --locked --release --manifest-path launcher/src-tauri/Cargo.toml

