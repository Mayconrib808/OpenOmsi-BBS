name: Validate Bridge 2.1.9.8 update candidate

on:
  push:
    branches: ['release/2.1.9.8']
    paths: ['release-candidates/2.1.9.8/**', 'scripts/verify_2198_candidate.py', '.github/workflows/release-2198.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-2198-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the exact previously delivered installer and embedded components
        run: python scripts/verify_2198_candidate.py
      - name: Native Windows interface and helper checks
        shell: pwsh
        run: |
          $env:BRIDGE_SETUP_PREVIEWS = Join-Path '${{ runner.temp }}' 'bridge-2198-previews'
          $h = Start-Process -FilePath 'build/verified-2198/HostAgent.exe' -ArgumentList '--gui-smoke' -Wait -PassThru
          if ($h.ExitCode -ne 0) { throw "HostAgent smoke failed: $($h.ExitCode)" }
          $s = Start-Process -FilePath 'build/verified-2198/Setup.exe' -ArgumentList '--gui-smoke' -Wait -PassThru
          if ($s.ExitCode -ne 0) { throw "Setup smoke failed: $($s.ExitCode)" }
          python scripts/test_pluginhost_windows.py build/verified-2198/app/compat/omsi-plugin-host32.exe --version 2.1.9.8
          if ($LASTEXITCODE -ne 0) { throw 'Plugin-host check failed' }
          python scripts/test_facade_windows.py build/verified-2198/app/compat/Omsi.exe
          if ($LASTEXITCODE -ne 0) { throw 'Facade check failed' }
      - name: Defender scan
        continue-on-error: true
        shell: pwsh
        run: ./scripts/scan_release_package.ps1 -PackagePath 'build/verified-2198/Defender-Input.zip' -UpdateOnly
      - name: Inspect Defender evidence
        shell: pwsh
        run: |
          $path = Join-Path '${{ runner.temp }}' 'openomsi-defender-report/report.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Missing Defender evidence' }
          $r = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($r.status -eq 'clean_in_this_environment_not_a_microsoft_false_positive_ruling') { exit 0 }
          $limitations = @('Microsoft Defender scanner is unavailable.','Defender real-time/download/cloud protection is unavailable; no clean result can be claimed.','Defender cloud validation failed; publication is blocked.','The remote procedure call failed.')
          if ($r.status -eq 'inconclusive' -and $limitations -contains [string]$r.error) {
            Write-Warning ('Hosted runner scan inconclusive; no clean verdict is claimed: ' + [string]$r.error)
            exit 0
          }
          throw ('Defender scan rejected this candidate: ' + [string]$r.status + ' ' + [string]$r.error)
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bridge-2.1.9.8-Windows-evidence
          path: |
            ${{ runner.temp }}/bridge-2198-previews/*
            ${{ runner.temp }}/openomsi-defender-report/*
          if-no-files-found: ignore
      - name: Upload the validated immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bridge-2.1.9.8-update-candidate
          path: |
            release-candidates/2.1.9.8/Atualizar-Bridge.exe
            release-candidates/2.1.9.8/candidate.json
            release-candidates/2.1.9.8/VALIDACAO.txt
          if-no-files-found: error
          retention-days: 30
