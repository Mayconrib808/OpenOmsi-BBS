name: Verify 2.2.2.1 Hotfix 1 cumulative changelog and Windows Setup
on:
  push:
    branches: [release/2.2.2.1-hotfix.1]
    paths:
      - .github/workflows/check-2221-hotfix1-changelog.yml
      - source/setup_changelog_windows.go
      - source/setup_gui_windows.go
      - source/setup_updates_windows.go
      - source/bridge_update.go
      - source/version.go
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: verify-2221-hotfix1-changelog
  cancel-in-progress: true
jobs:
  setup-gui:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Build the actual signed-resource Setup.exe from current Go sources
        shell: pwsh
        run: |
          @'
          import os,subprocess,sys,tempfile,shutil
          from pathlib import Path
          sys.path.insert(0,'scripts')
          import build,setup_resources
          assert build.VERSION=='2.2.2.1-hotfix.1'
          dest=Path('smoke-package').resolve()
          dest.mkdir()
          work=Path(tempfile.mkdtemp(prefix='changelog-setup-'))
          for name in build.PROGRAMS['Setup.exe']:
              shutil.copy2(build.SOURCE/name,work/name)
          (work/'go.mod').write_text('module openomsi-bbs/setup\n\ngo 1.23.2\n')
          resources=setup_resources.prepare(work,build.SOURCE/'resources')
          flags='-s -w -H=windowsgui -X=main.bridgeUpdateOrigin=https://openomsi-bbs-updates.maycongamesmaximo.workers.dev -X=main.bridgeUpdateSequence=2026103103'
          env={**os.environ,'GOOS':'windows','GOARCH':'386','GO386':'sse2','CGO_ENABLED':'0','GOTOOLCHAIN':'local','GO111MODULE':'on'}
          subprocess.run(['go','build','-trimpath','-buildvcs=false','-ldflags='+flags,'-o',str(dest/'Setup.exe'),'.'],cwd=work,env=env,check=True)
          setup_resources.verify_executable(dest/'Setup.exe',resources)
          print('Built Setup 2.2.2.1 Hotfix 1 with verified icon and banner resources')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Changelog Setup build failed' }
      - name: GUI smoke: 9 prior versions, all cumulative sections, 3 locales
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:BRIDGE_SETUP_PREVIEWS=(New-Item -ItemType Directory -Force smoke-previews).FullName
          $test=Start-Process -FilePath (Resolve-Path 'smoke-package/Setup.exe') -ArgumentList '--gui-smoke' -Wait -PassThru
          if ($test.ExitCode -ne 0) {
            Get-ChildItem smoke-package -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 70 }
            throw "Setup GUI smoke exited with code $($test.ExitCode)"
          }
          foreach($l in @('pt','en','de')){
            if(-not(Test-Path "smoke-previews/changelog-$l.png")){throw "Missing $l release tour screenshot"}
          }
          if(-not(Test-Path 'smoke-previews/changelog-pt-section-10.png')){throw 'Oldest accumulated release section is inaccessible'}
          $sum=(Get-FileHash smoke-package/Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified 3 languages, 11 cumulative sections and automatic 2.2.2.1 Hotfix 1 changelog. Setup sha256: $sum"
      - uses: actions/upload-artifact@v4
        with:
          name: Bridge-2.2.2.1-Hotfix1-changelog-Windows-QA
          path: |
            smoke-package/Setup.exe
            smoke-previews/changelog-*.png
          if-no-files-found: error
          retention-days: 30
