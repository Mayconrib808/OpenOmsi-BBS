name: Append 2.2.2.1 bus courtesy translations
on:
  push:
    branches: [feature/2221-bays-courtesy-double-parking]
    paths:
      - .github/scripts/apply-2221-courtesy-locales.py
      - .github/workflows/merge-2221-bus-courtesy-locales.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/2221-bays-courtesy-double-parking
          persist-credentials: true
      - name: Add label in all 29 languages
        run: python .github/scripts/apply-2221-courtesy-locales.py
      - name: Commit the localized game catalog
        shell: bash
        run: |
          git add crates/omsi-app/locales/app.yml
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'i18n(2221): localize bus courtesy setting in 29 languages'
          git push origin HEAD:feature/2221-bays-courtesy-double-parking
