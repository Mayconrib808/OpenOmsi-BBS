# The public server list of openOMSI (see README.md beside this file).
name = "openomsi-serverlist"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "LIST"
class_name = "List"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["List"]

# Terms (comma separated, lower case) the list refuses in a server's name or message, on top
# of the built-in rules. The games check what they show themselves as well.
# [vars]
# BLOCKED_TERMS = ""
